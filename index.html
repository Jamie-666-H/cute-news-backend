<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, minimum-scale=1, user-scalable=no">
<title>我的小天地 · 粉色工作台</title>
<style>
  :root{
    --pink:#ff9ec4;
    --pink-deep:#ff6fa5;
    --pink-soft:#ffd9e8;
    --bg:#fff5f8;
    --card:#ffffff;
    --text:#6b4555;
    --text-soft:#a98295;
    --line:#ffe1ec;
    --shadow:0 8px 24px rgba(255,143,177,.18);
    --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
    background:linear-gradient(135deg,#fff0f6 0%,#ffe3ef 100%);
    color:var(--text);
    display:flex;
    min-height:100vh;
    overflow:hidden;
    overscroll-behavior:none;
  }
  /* ---------- 侧边栏 ---------- */
  .sidebar{
    width:240px;
    flex-shrink:0;
    background:rgba(255,255,255,.75);
    backdrop-filter:blur(8px);
    border-right:2px solid var(--line);
    display:flex;
    flex-direction:column;
    padding:18px 14px;
  }
  .brand{
    text-align:center;
    margin-bottom:18px;
  }
  .brand .logo{font-size:34px}
  .brand h1{font-size:19px;color:var(--pink-deep);margin-top:4px;letter-spacing:1px}
  .brand p{font-size:11px;color:var(--text-soft);margin-top:2px}
  .nav{list-style:none;flex:1;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:11px 13px;
    border-radius:14px;
    cursor:pointer;
    color:var(--text);
    font-size:15px;font-weight:600;
    transition:all .18s ease;
    user-select:none;
    border:2px solid transparent;
  }
  .nav-item:hover{background:var(--pink-soft);transform:translateX(3px)}
  .nav-item.active{
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;box-shadow:var(--shadow);
  }
  .nav-icon{
    width:34px;height:34px;flex-shrink:0;
    display:grid;place-items:center;
    background:var(--pink-soft);
    border-radius:11px;font-size:18px;
  }
  .nav-item.active .nav-icon{background:rgba(255,255,255,.3)}
  .nav-hint{font-size:10px;color:var(--text-soft);text-align:center;margin-bottom:8px}
  .gear{
    margin-top:10px;padding:10px;border:none;border-radius:14px;
    background:var(--pink-soft);color:var(--pink-deep);
    font-size:14px;font-weight:700;cursor:pointer;width:100%;
  }
  .gear:hover{background:var(--pink);color:#fff}
  .gear-top{display:none}
  /* ---------- 主区域 ---------- */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;
    padding:18px 26px;gap:18px;
    background:rgba(255,231,240,.72);
    border-bottom:2px solid var(--line);
  }
  .clock-box{display:flex;flex-direction:column;gap:2px}
  .greeting{font-size:13px;font-weight:600;color:var(--pink-deep);opacity:.85}
  .clock{font-size:38px;font-weight:800;color:var(--pink-deep);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .date{font-size:13px;color:var(--text-soft);margin-top:3px}
  .top-stats{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
  .top-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:14px;background:var(--pink-soft);color:var(--pink-deep);font-size:13px;font-weight:700;white-space:nowrap}
  .top-pill .em{font-size:15px;line-height:1}
  .top-pill .v{font-variant-numeric:tabular-nums}
  /* 顶栏天气卡片：蓬松真实云朵☁️（无描边·白→淡粉渐变填充+羽化软边+柔粉投影），可爱柔和 */
  .weather-chip{
    position:relative;
    display:inline-flex;align-items:center;gap:11px;
    padding:17px 30px 19px;margin:8px 7px 14px;cursor:pointer;user-select:none;
    transition:transform .15s;white-space:nowrap;
    animation:cloudfloat 4.5s ease-in-out infinite;
  }
  .weather-chip:hover{animation:none;transform:translateY(-3px)}
  .cloud-bg{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;
    filter:url(#cloudSoft) drop-shadow(0 9px 15px rgba(255,150,185,.30))}
  .weather-inner{position:relative;z-index:1;display:inline-flex;align-items:center;gap:11px}
  .weather-emoji{font-size:34px;line-height:1;animation:wxfloat 3.2s ease-in-out infinite}
  .weather-info{display:flex;flex-direction:column;line-height:1.12}
  .weather-temp{font-size:26px;font-weight:800;color:var(--pink-deep);font-variant-numeric:tabular-nums}
  .weather-city{font-size:13px;color:var(--text-soft);margin-top:3px}
  .weather-loading{font-size:14px;font-weight:700;color:var(--pink-deep);opacity:.85}
  @keyframes wxfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes cloudfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .quote-box{
    margin:0 26px;margin-top:16px;
    background:rgba(255,255,255,.7);
    border:2px dashed var(--pink);
    border-radius:var(--radius);
    padding:14px 20px;text-align:center;
  }
  .quote-cn{font-size:17px;font-weight:700;color:var(--pink-deep)}
  .quote-en{font-size:13px;color:var(--text-soft);margin-top:5px;font-style:italic}
  .quote-tag{font-size:11px;color:var(--text-soft);margin-bottom:4px}
  /* ---------- 视图 ---------- */
  .view-wrap{flex:1;overflow-y:auto;padding:22px 26px 40px}
  .mod-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
  .mod-head h2{font-size:22px;color:var(--pink-deep)}
  .stats{display:flex;gap:8px;flex-wrap:wrap}
  .stats span{background:var(--pink-soft);color:var(--pink-deep);font-size:12px;font-weight:700;padding:5px 11px;border-radius:20px}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tabs button{
    border:2px solid var(--line);background:#fff;color:var(--text-soft);
    padding:6px 16px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer;
  }
  .tabs button.on{background:var(--pink);border-color:var(--pink);color:#fff}
  .tabs button.clear{margin-left:auto;border-color:#ffd0d0;color:#e07a8b}
  .add-form{
    display:flex;gap:8px;flex-wrap:wrap;background:var(--card);
    padding:14px;border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;
  }
  .add-form input,.add-form select{
    border:2px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;
    color:var(--text);background:#fff5f8;outline:none;flex:1;min-width:120px;
  }
  .add-form input:focus,.add-form select:focus{border-color:var(--pink)}
  .add-form button{
    border:none;border-radius:12px;padding:9px 20px;
    background:linear-gradient(135deg,var(--pink),var(--pink-deep));
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  .add-form button:hover{filter:brightness(1.05)}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{
    display:flex;align-items:center;gap:12px;
    background:var(--card);border-radius:14px;padding:12px 16px;
    box-shadow:0 4px 14px rgba(255,143,177,.10);
  }
  .item.done{opacity:.55}
  .item .chk{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer}
  .item .chk input{width:18px;height:18px;accent-color:var(--pink-deep)}
  .item .title{font-weight:700;font-size:15px}
  .item .meta{font-size:12px;color:var(--text-soft);margin-top:3px}
  .item .sub{font-size:12px;color:var(--text-soft)}
  .item .del,.item .star{
    border:none;background:var(--pink-soft);border-radius:10px;
    width:34px;height:34px;font-size:15px;cursor:pointer;flex-shrink:0;
  }
  .item .del:hover{background:#ffd0d0}
  .item .star.on{background:var(--pink);color:#fff}
  .empty{text-align:center;color:var(--text-soft);padding:30px;font-size:14px}
  /* 待办：固定事项 + 每日随机 + 提醒 */
  .todo-sec{background:linear-gradient(135deg,#fff,#fff4f9);border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:16px;box-shadow:0 4px 14px rgba(255,143,177,.10)}
  .todo-sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800;font-size:16px;color:var(--pink-deep);margin-bottom:4px}
  .todo-sec-sub{font-size:12px;color:var(--text-soft);margin:2px 0 12px;line-height:1.5}
  .add-form .time-in{flex:0 0 auto;min-width:0;width:118px}
  .add-form .imp{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-soft);flex:0 0 auto}
  .item .time-badge{border:2px solid var(--line);background:var(--pink-soft);color:var(--pink-deep);border-radius:10px;padding:5px 8px;font-size:13px;font-weight:700;cursor:pointer;flex-shrink:0}
  .reroll{border:none;background:var(--pink-soft);color:var(--pink-deep);border-radius:10px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .reroll:hover{background:var(--pink);color:#fff}
  .pool-box{margin-top:6px;border-top:1px dashed var(--line);padding-top:12px}
  .pool-box summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--pink-deep);margin-bottom:10px}
  .pool-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .pool-item{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:5px 6px 5px 12px;font-size:13px;color:var(--text)}
  .pool-item .del{width:24px;height:24px;font-size:12px}
  .count-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-soft);margin-top:4px}
  .count-in{width:64px;border:2px solid var(--line);border-radius:10px;padding:5px 8px;font-size:13px;text-align:center;color:var(--text);background:#fff5f8}
  .remind-row{display:flex;align-items:center;gap:12px;margin-top:8px}
  .remind-state{font-size:13px;color:var(--text-soft);font-weight:600}
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0}
  .switch input{opacity:0;width:0;height:0}
  .switch .track{position:absolute;inset:0;background:#e9d3dd;border-radius:20px;transition:.2s;cursor:pointer}
  .switch .track:before{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch input:checked+.track{background:linear-gradient(135deg,var(--pink),var(--pink-deep))}
  .switch input:checked+.track:before{transform:translateX(20px)}
  .pill{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--pink-soft);color:var(--pink-deep);font-weight:700}
  .pos{color:#3f9c5a;font-weight:700}
  .neg{color:#e07a8b;font-weight:700}
  .cet6-title{font-size:14px;font-weight:700;color:var(--pink-deep);margin:2px 0 10px}
  .cet6{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:18px}
  .cet6-card{background:linear-gradient(135deg,#fff,#fff0f6);border:2px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 4px 14px rgba(255,143,177,.12)}
  .cet6-w{font-size:18px;font-weight:800;color:var(--pink-deep)}
  .cet6-pos{font-size:12px;color:var(--text-soft);font-weight:600;margin-left:6px}
  .cet6-cn{font-size:14px;margin-top:4px;color:var(--text)}
  .cet6-ex{font-size:12px;color:var(--text-soft);margin-top:8px;line-height:1.5}
  .cet6-act{display:flex;gap:8px;margin-top:10px}
  .cet6-act button{flex:1;border:none;border-radius:12px;padding:8px;font-weight:700;font-size:13px;cursor:pointer}
  .spk{border:none;background:var(--pink-soft);color:var(--pink-deep);border-radius:50%;width:30px;height:30px;font-size:14px;cursor:pointer;margin-left:8px;flex-shrink:0;vertical-align:middle;transition:transform .12s}
  .spk:hover{background:var(--pink);color:#fff;transform:scale(1.08)}
  .spk:active{transform:scale(.94)}
  .spk.mini{width:24px;height:24px;font-size:11px;margin-left:5px}
  /* 英语学习：2×2 单词卡 + 巩固小游戏 */
  .eng-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px}
  .eng-card{background:linear-gradient(135deg,#fff,#fff0f6);border:2px solid var(--line);border-radius:14px;padding:11px 12px;box-shadow:0 3px 10px rgba(255,143,177,.10)}
  .eng-w{font-size:17px;font-weight:800;color:var(--pink-deep);display:flex;align-items:center;gap:6px}
  .eng-w .spk{margin-left:auto}
  .eng-ph{font-size:12px;color:var(--text-soft);margin-top:3px;font-style:italic;letter-spacing:.3px}
  .eng-pos{font-style:normal;margin-left:5px;font-weight:600}
  .eng-cn{font-size:13px;color:var(--text);margin-top:3px;line-height:1.4}
  .eng-game{background:#fff;border:2px dashed var(--pink);border-radius:16px;padding:16px;box-shadow:0 4px 14px rgba(255,143,177,.10)}
  .eng-game-head{font-weight:800;color:var(--pink-deep);font-size:15px;display:flex;align-items:center;gap:8px}
  .eng-start{margin-top:6px;border:none;border-radius:12px;padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer}
  .eng-q{margin:12px 0 4px;font-size:16px}
  .eng-q-w{font-weight:800;color:var(--pink-deep);font-size:22px}
  .eng-q-cn{font-weight:800;font-size:19px;color:var(--pink-deep)}
  .eng-q-sub{font-size:13px;color:var(--text-soft);margin-top:5px}
  .eng-opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
  .eng-opt{border:2px solid var(--line);background:#fff;color:var(--text);border-radius:12px;padding:11px 10px;font-size:14px;font-weight:600;cursor:pointer;transition:.12s;word-break:break-word}
  .eng-opt:hover:not(:disabled){border-color:var(--pink)}
  .eng-opt.correct{background:#e7f8ec;border-color:#56c47a;color:#1f8a45}
  .eng-opt.wrong{background:#ffeaea;border-color:#ff8aa0;color:#d6336c}
  .eng-fb{margin-top:10px;font-weight:700;font-size:14px}
  .eng-fb.ok{color:#1f8a45}
  .eng-fb.no{color:#d6336c}
  .eng-next{border:none;border-radius:12px;padding:9px 18px;font-weight:800;cursor:pointer}
  .eng-result{font-size:20px;margin:10px 0}
  .eng-result b{color:var(--pink-deep)}
  .eng-emoji{font-size:15px;margin-bottom:12px}
  .eng-stages{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
  .eng-chip{font-size:12px;font-weight:700;background:var(--pink-soft);color:var(--pink-deep);border-radius:20px;padding:4px 10px}
  .eng-play{border:2px solid var(--pink);background:#fff;color:var(--pink-deep);border-radius:12px;padding:11px 18px;font-weight:800;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .eng-play:hover{background:var(--pink);color:#fff}
  .eng-slots{display:flex;flex-wrap:wrap;gap:7px;margin:14px 0 4px;justify-content:center}
  .eng-slot{width:34px;height:40px;border:2px dashed var(--pink);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;color:var(--pink-deep);text-transform:lowercase}
  .eng-slot.filled{border-style:solid;background:var(--pink-soft)}
  .eng-tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:center}
  .eng-tile{border:2px solid var(--line);background:#fff;color:var(--pink-deep);border-radius:10px;width:38px;height:42px;font-size:19px;font-weight:800;cursor:pointer;text-transform:lowercase;transition:.12s}
  .eng-tile:hover:not(:disabled){border-color:var(--pink);transform:translateY(-2px)}
  .eng-tile.used{opacity:.3;cursor:default}
  /* 阅读 / 新闻 卡片 */
  .mute{color:var(--text-soft);font-size:13px}
  .reader{background:var(--card);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
  .reader-card h3{font-size:18px;color:var(--pink-deep);margin-bottom:4px}
  .reader-card .au{font-size:12px;color:var(--text-soft);margin-bottom:12px}
  .read-en{font-size:15px;line-height:2;color:var(--text)}
  .read-zh{font-size:14px;line-height:1.8;color:var(--text-soft);margin-top:8px}
  .read-note{margin-top:14px;background:var(--pink-soft);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--pink-deep)}
  .read-link{margin-top:12px}
  .read-link a{display:inline-block;font-size:13px;font-weight:700;color:var(--pink-deep);text-decoration:none;background:var(--pink-soft);padding:6px 14px;border-radius:20px}
  .read-link a:active{opacity:.7}
  .src-tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px;margin-bottom:8px;background:var(--pink-soft);color:var(--pink-deep)}
  .src-tag.ted{background:linear-gradient(135deg,#e8416f,#ff7eb3);color:#fff}
  .read-filters{display:flex;gap:8px;margin:10px 0 2px;flex-wrap:wrap}
  .read-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 2px}
  .read-top .read-filters{flex:1;margin:0;min-width:200px}
  .read-refresh{white-space:nowrap;flex:0 0 auto;font-size:13px;padding:7px 16px}
  .b-chip{font-size:13px;padding:6px 14px;border-radius:20px;border:1px solid var(--pink-soft);background:#fff;color:var(--pink-deep);cursor:pointer;transition:.15s}
  .b-chip.on{background:linear-gradient(135deg,#e8416f,#ff7eb3);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(232,65,111,.25)}
  .read-quiz{margin-top:16px;background:linear-gradient(135deg,#fff,#fff6fa);border:1px solid var(--pink-soft);border-radius:14px;padding:14px 16px}
  .rq-head{font-size:13px;font-weight:700;color:var(--pink-deep);margin-bottom:10px}
  .rq-q{margin-bottom:12px}
  .rq-q:last-child{margin-bottom:0}
  .rq-qw{font-size:14px;font-weight:600;margin-bottom:8px;color:var(--text)}
  .rq-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .rq-opt{font-size:13px;padding:9px 10px;border-radius:10px;border:1px solid var(--pink-soft);background:#fff;color:var(--text);cursor:pointer;text-align:left;transition:.15s;line-height:1.4}
  .rq-opt:hover:not(:disabled){border-color:#ff7eb3;background:#fff0f6}
  .rq-opt:disabled{cursor:default}
  .rq-opt.correct{background:#e8f8ee;border-color:#52c98a;color:#1d8a55;font-weight:700}
  .rq-opt.wrong{background:#fdeaea;border-color:#e8696b;color:#c0392b}
  .rq-fb{font-size:12px;margin-top:6px}
  .rq-fb.ok{color:#1d8a55}
  .rq-fb.no{color:#c0392b}
  .rq-result{font-size:15px;margin:6px 0 4px;color:var(--text)}
  .rq-result b{color:var(--pink-deep);font-size:18px}
  .rq-emoji{font-size:14px;margin-bottom:12px}
  .rq-start{font-size:14px;padding:10px 22px;border-radius:22px;border:none;cursor:pointer}
  .reader-card .spk{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--pink);background:#fff;color:var(--pink-deep);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;margin-top:10px}
  .reader-card .spk:hover{background:var(--pink);color:#fff}
  .reader-body{font-size:14px;line-height:1.8;color:var(--text);white-space:pre-wrap}
  /* 卡片网格（书/新闻等） */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 4px 14px rgba(255,143,177,.10);position:relative}
  .card h3{font-size:15px;color:var(--pink-deep);margin-bottom:4px}
  .card .au{font-size:12px;color:var(--text-soft);margin-bottom:8px}
  .card .row{display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-top:4px}
  .card a{color:var(--pink-deep);font-weight:700;text-decoration:none;font-size:13px}
  .card .del{position:absolute;top:10px;right:10px}
  /* --- 心情相框（随手拍小相框 · 俏皮乱摆版） --- */
  .frame-feed{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;align-items:start;margin:10px 0 16px}
  .frame{position:relative;background:#fff;padding:9px 9px 8px;border-radius:20px;box-shadow:0 6px 18px rgba(255,143,177,.18);transition:transform .2s ease, box-shadow .2s ease;will-change:transform;transform:rotate(var(--rot,0deg)) translateX(var(--dx,0));margin-top:var(--mt,0)}
  .frame:hover{transform:rotate(var(--rot,0deg)) scale(1.035);box-shadow:0 12px 28px rgba(255,143,177,.30);z-index:3}
  .frame-photo{position:relative;width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:linear-gradient(135deg,#ffe9f1,#eaf1ff);cursor:default}
  .frame-photo.viewable{cursor:pointer}
  .frame-photo img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
  .frame-photo.viewable:hover img{transform:scale(1.06)}
  .frame-photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e89bb4;font-size:12px;gap:6px;background:linear-gradient(135deg,#fff6fb,#f2f7ff)}
  .frame-photo .ph .cam{font-size:28px;opacity:.85}
  .frame-deco{position:absolute;top:-10px;left:50%;transform:translateX(-50%) rotate(-7deg);font-size:15px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.08));pointer-events:none}
  .frame-x{position:absolute;top:7px;right:7px;width:24px;height:24px;border:none;border-radius:50%;background:rgba(255,255,255,.9);color:#e06b8a;font-size:15px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .frame-swap{position:absolute;bottom:7px;right:7px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,.92);font-size:13px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
  .frame-swap:hover{background:#fff}
  .frame-cap{width:100%;border:none;background:transparent;resize:none;margin-top:9px;font:inherit;font-size:12.5px;line-height:1.55;color:var(--text);min-height:34px;box-sizing:border-box;padding:2px 3px}
  .frame-cap:focus{outline:none}
  .frame-cap::placeholder{color:#d9a7b8}
  .frame-add{background:linear-gradient(135deg,#ffffff,#fff6fb);border:2px dashed #ffb3cd;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--pink-deep);cursor:pointer;aspect-ratio:1/1;font-size:12px;gap:6px;transition:transform .16s ease, background .16s ease}
  .frame-add:hover{transform:rotate(-3deg) scale(1.04);background:#fff0f6;border-color:var(--pink)}
  .frame-add .plus{font-size:34px;line-height:1;font-weight:300;opacity:.85}
  .frame-feed .frame{margin:0;margin-top:var(--mt,0)}
  .frame-feed .frame-add{margin:0}
  @media(min-width:720px){ .frame-feed{gap:16px 18px} }
  .frame-empty{text-align:center;color:var(--text-soft);font-size:13px;padding:18px 0 8px;line-height:1.6}
  .frame-more{break-inside:avoid;margin:4px 0 18px;display:flex;justify-content:center}
  .frame-more button{border:none;background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;border-radius:22px;padding:9px 18px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(255,143,177,.4);transition:transform .15s}
  .frame-more button:hover{transform:scale(1.06) rotate(-2deg)}
  /* 心情相框 · 日期翻看 & 当日手账 */
  .plog-bar{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:16px;padding:7px 9px;box-shadow:0 4px 14px rgba(255,143,177,.12);margin:6px 0 12px}
  .plog-bar .nav{border:none;background:var(--pink-soft);color:var(--pink-deep);width:28px;height:28px;border-radius:9px;font-size:17px;line-height:1;cursor:pointer;flex-shrink:0;transition:transform .12s,background .12s}
  .plog-bar .nav:hover{transform:scale(1.12);background:#ffd9e7}
  .plog-bar .cur{flex:1;border:2px solid var(--line);background:linear-gradient(135deg,#ffffff,#fff5fa);color:var(--pink-deep);font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer;border-radius:13px;padding:7px 8px;display:flex;align-items:center;justify-content:center;gap:5px;transition:transform .12s,border-color .12s}
  .plog-bar .cur:hover{transform:scale(1.02);border-color:var(--pink)}
  .plog-bar .cur .bk{font-size:14px}
  .plog-bar .today{border:none;background:var(--pink);color:#fff;border-radius:11px;padding:5px 10px;font-size:11.5px;font-weight:700;cursor:pointer;flex-shrink:0}
  .plog-daylabel{font-size:12px;color:var(--text-soft);margin:10px 2px 4px;display:flex;align-items:center;gap:4px}
  .plog-daynote{width:100%;border:2px dashed var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:13px;line-height:1.5;color:var(--text);box-sizing:border-box;background:#fffdfe;resize:vertical;min-height:46px;margin-bottom:6px}
  .plog-daynote:focus{outline:none;border-color:var(--pink)}
  .plog-daynote::placeholder{color:#d9a7b8}
  /* 有照片的日期胶囊，点一下直接看那天 */
  .plog-chips{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 10px}
  .plog-chips .chip{border:none;background:var(--pink-soft);color:var(--pink-deep);border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;transition:transform .12s,background .12s}
  .plog-chips .chip:hover{transform:scale(1.05);background:#ffd9e7}
  .plog-chips .chip.on{background:var(--pink);color:#fff}
  .plog-chips .chip .n{font-size:10px;opacity:.85}
  /* 长按多选删除 */
  .frame{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  .frame-cap{user-select:text;-webkit-user-select:text}
  .frame.sel{outline:3px solid var(--pink);outline-offset:2px}
  .frame.sel::after{content:'✓';position:absolute;top:6px;left:6px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;z-index:6}
  .frame.sel .frame-x{display:none}

  .frame-selbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:10px;justify-content:center;padding:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);box-shadow:0 -4px 18px rgba(255,143,177,.28);border-top:2px solid var(--pink)}

  .frame-selbar .del{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;box-shadow:0 4px 12px rgba(255,143,177,.45)}
  .frame-selbar .cancel{background:#fff;color:var(--text-soft);border:2px solid var(--line)}
  .selmode .frame-feed{padding-bottom:72px}
  /* 日历弹窗（日历本） */

  .cal-pop{width:300px;max-width:92vw;background:#fff;border-radius:22px;box-shadow:0 14px 44px rgba(232,65,111,.34);overflow:hidden;position:relative;animation:calIn .18s ease}

  .cal-head{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;position:relative}
  .cal-head::before{content:'';position:absolute;left:16px;top:0;width:8px;height:100%;background:repeating-linear-gradient(180deg,rgba(255,255,255,.35) 0 4px,transparent 4px 9px)}
  .cal-head .ttl{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;margin:0 auto}
  .cal-head .mnav{border:none;background:rgba(255,255,255,.25);color:#fff;width:30px;height:30px;border-radius:9px;font-size:16px;line-height:1;cursor:pointer;transition:background .12s}
  .cal-head .mnav:hover{background:rgba(255,255,255,.45)}
  .cal-week{display:grid;grid-template-columns:repeat(7,1fr);padding:9px 10px 0;color:var(--text-soft);font-size:11px;text-align:center;font-weight:700}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:6px 10px 12px}
  .cal-grid button{border:none;background:transparent;color:var(--text);font:inherit;font-size:13px;aspect-ratio:1/1;border-radius:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;transition:background .12s}
  .cal-grid button:hover{background:var(--pink-soft)}
  .cal-grid button.muted{color:#dcc6d0}
  .cal-grid button.todaycell{background:var(--pink-soft);font-weight:800;color:var(--pink-deep)}
  .cal-grid button.selcell{background:linear-gradient(135deg,var(--pink),var(--pink-deep));color:#fff;font-weight:800;box-shadow:0 4px 10px rgba(232,65,111,.4)}
  .cal-grid button .dot{position:absolute;bottom:5px;width:4px;height:4px;border-radius:50%;background:var(--pink)}
  .cal-grid button.selcell .dot,.cal-grid button.todaycell .dot{background:#fff}
  .cal-foot{display:flex;gap:8px;padding:0 12px 14px}

<script>
/* ===================== 工具函数 ===================== */
const $ = s => document.querySelector(s);
const KEY = 'cute-workbench-v1';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
/* 云端同步配置（与新闻后端同一服务） */
// 后端地址：同源托管（workers.dev / localhost）自动用当前域；其余（jsDelivr / GitHub Pages 等）指向 Cloudflare Worker 真实地址（后端已开 CORS）
const BACKEND = (location.hostname.endsWith('workers.dev') || location.hostname === 'localhost' || location.protocol === 'file:')
  ? location.origin
  : 'https://cute-news-backend.2476965636.workers.dev';
const SYNC_KEY = 'cute-workbench-sync-v1';
function todayStr(d=new Date()){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function dayOfYear(d=new Date()){
  const start=new Date(d.getFullYear(),0,0);
  return Math.floor((d-start)/86400000);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),1800); }
function compressImage(file, maxW=720, q=0.72){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const im=new Image();
      im.onload=()=>{ let w=im.width,h=im.height; if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(im,0,0,w,h);
        try{ res(cv.toDataURL('image/jpeg',q)); }catch(e){ rej(e); } };
      im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
function nowTime(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function speak(text,lang){
  lang=lang||'en-US';
  if(!('speechSynthesis' in window)){ toast('当前浏览器暂不支持朗读 🔇'); return; }
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang; u.rate=0.92; u.pitch=1.0;
    window.speechSynthesis.speak(u);
  }catch(e){ toast('朗读失败，请重试'); }
}

/* ===================== 数据层 ===================== */
function defaults(){
  const order=['english','reading','finance','todo','news','mood','music'];
  const daily={english:false,reading:false,finance:false,todo:true,news:false,mood:true,music:false};
  return {
    navOrder:order.slice(),
    newsOrder:['央视新闻','新华网','人民网','微博热搜','百度热点','抖音热点','小红书热点','热门'],
    settings:{daily},
    english:{words:[]},
    reading:{books:[],logs:[]},
    finance:{txns:[]},
    todo:{
      fixed:[],
      randomPool:[
        {id:'rp1',text:'喝一杯温水 💧'},
        {id:'rp2',text:'活动脖子和肩膀 3 分钟'},
        {id:'rp3',text:'读几页喜欢的书 📚'},
        {id:'rp4',text:'写下一句今天的小确幸 ✨'},
        {id:'rp5',text:'出门散散步 15 分钟 🌿'},
        {id:'rp6',text:'做一组拉伸 🧘'},
        {id:'rp7',text:'给在乎的人发个消息 💬'},
        {id:'rp8',text:'整理一下桌面和心情 🧹'},
        {id:'rp9',text:'对镜子笑一下，夸夸自己 🌸'},
        {id:'rp10',text:'复盘今天学到的东西 🧠'},
        {id:'rp11',text:'早点躺下，保证睡够 ⭐'},
        {id:'rp12',text:'听一首喜欢的歌 🎵'}
      ],
      randomCount:3,
      randomToday:{date:'',ids:[]},
      done:{}
    },
    news:{items:[]},
    mood:{entries:[],plogs:[],dailyNotes:{}}
  };
}
function normalizeTodo(d){
  if(!d || !d.todo || typeof d.todo!=='object'){ if(d) d.todo=defaults().todo; return; }
  const b=defaults().todo;
  if(!Array.isArray(d.todo.fixed)) d.todo.fixed=[];
  if(!Array.isArray(d.todo.randomPool) || d.todo.randomPool.length===0) d.todo.randomPool=b.randomPool.slice();
  if(typeof d.todo.randomCount!=='number' || d.todo.randomCount<1) d.todo.randomCount=b.randomCount;
  if(!d.todo.randomToday || typeof d.todo.randomToday!=='object') d.todo.randomToday={date:'',ids:[]};
  if(!d.todo.done || typeof d.todo.done!=='object') d.todo.done={};
}
function migrateTodo(d){
  if(d && d.todo && Array.isArray(d.todo.tasks)){
    // 旧版扁平待办 -> 全部迁移为「固定事项」（不带提醒时间）
    const fixed=(d.todo.tasks||[]).map(t=>({
      id:(t&&t.id)||uid(), text:(t&&t.text)||'', important:!!(t&&t.important), time:''
    }));
    d.todo.fixed=fixed; delete d.todo.tasks;
  }
  normalizeTodo(d);
}
function load(){
  try{ const r=localStorage.getItem(KEY); if(!r) return defaults();
    const d=JSON.parse(r); const base=defaults();
    migrateTodo(d);
    // 浅合并，保证新字段存在
    for(const k in base){ if(!(k in d)) d[k]=base[k]; }
    if(!d.settings) d.settings=base.settings;
    if(!d.settings.daily) d.settings.daily=base.settings.daily;
    if(!d.updated) d.updated=0;
    return d;
  }catch(e){ return defaults(); }
}
/* IndexedDB 本地持久化：容量远大于 localStorage(约5MB)，可容纳每天照片记录，不再报"空间不足" */
const IDB_NAME='cute-workbench-idb', IDB_STORE='db', IDB_KEY='main';
function idbOpen(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>{ try{ r.result.createObjectStore(IDB_STORE); }catch(e){} }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
function idbSave(db){ return idbOpen().then(c=>new Promise((res,rej)=>{ const t=c.transaction(IDB_STORE,'readwrite'); t.objectStore(IDB_STORE).put(db,IDB_KEY); t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); })); }
function idbLoad(){ return idbOpen().then(c=>new Promise((res,rej)=>{ const t=c.transaction(IDB_STORE,'readonly'); const rq=t.objectStore(IDB_STORE).get(IDB_KEY); rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error); })); }
async function loadIdb(){ let d=null; try{ d=await idbLoad(); }catch(e){} if(d){ migrateTodo(d); const base=defaults(); for(const k in base){ if(!(k in d)) d[k]=base[k]; } if(!d.settings) d.settings=base.settings; if(!d.settings.daily) d.settings.daily=base.settings.daily; if(!d.updated) d.updated=0; DB=d; } else { DB=load(); } }
let DB = defaults();
function save(){ DB.updated=Date.now(); idbSave(DB).catch(()=>{}); try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){} schedulePush(); }

/* ===================== 云端同步 ===================== */
let _pushTimer=null, _suppressPush=false;
function schedulePush(){ if(_suppressPush) return; clearTimeout(_pushTimer); _pushTimer=setTimeout(pushSync,1200); }
function mergeValue(lv, rv){
  if(rv && typeof rv==='object' && !Array.isArray(rv) && lv && typeof lv==='object' && !Array.isArray(lv)){
    const out=Object.assign({}, lv);
    for(const k of Object.keys(rv)){
      if(k==='updated') continue;
      out[k]=mergeValue(out[k], rv[k]);
    }
    return out;
  }
  if(Array.isArray(rv)&&Array.isArray(lv)){
    const m=new Map();
    const key=x=>(x&&x.id!==undefined)?String(x.id):JSON.stringify(x);
    lv.forEach(x=>m.set(key(x),x));
    rv.forEach(x=>m.set(key(x),x));
    return [...m.values()];
  }
  return rv===undefined?lv:rv;
}
function mergeDB(local, remote){
  const out=mergeValue(local, remote);
  out.updated=Math.max(Number(local&&local.updated)||0, Number(remote&&remote.updated)||0);
  return out;
}
async function pushSync(){
  if(!navigator.onLine){ setSync('off'); return; }
  try{
    setSync('ing');
    let data=DB;
    if(_cryptoKey){ data=await encObj(DB, _cryptoKey); }   // 开启密码锁 → 上传密文
    const body=JSON.stringify({updated:DB.updated||0, data});
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(BACKEND+'/api/sync?key='+encodeURIComponent(SYNC_KEY),{method:'POST',headers:{'Content-Type':'application/json'},body,signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw 0;
    setSync('ok');
  }catch(e){ setSync('off'); }
}
async function pullSync(silent){
  if(!navigator.onLine){ setSync('off'); return false; }
  try{
    setSync('ing');
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),8000);
    const r=await fetch(BACKEND+'/api/sync?key='+encodeURIComponent(SYNC_KEY),{cache:'no-store',signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) throw 0;
    const j=await r.json();
    if(j&&j.data){
      let remote=j.data;
      if(isEnc(remote)){
        if(!_cryptoKey){ const ok=await ensureKey(); if(!ok){ setSync('off'); return false; } }
        remote=await decObj(remote, _cryptoKey);
      }
      const ru=Number(remote&&remote.updated)||0; const lu=Number(DB.updated)||0;
      // 空壳保护：云端 mood 是空壳（无 plogs 且无 entries）但本地有相框 → 用本地 mood 替换，避免被空壳冲掉今天的照片
      const _rm=remote.mood, _lm=DB.mood;
      if(_rm && _lm && (!_rm.plogs||!_rm.plogs.length) && (!_rm.entries||!_rm.entries.length) && ((_lm.plogs&&_lm.plogs.length)||(_lm.entries&&_lm.entries.length))){
        remote=Object.assign({}, remote, {mood:_lm});
      }
      if(ru>lu){
        _suppressPush=true;
        DB=mergeDB(DB, remote);
        DB.updated=Math.max(lu,ru);
        save();
        _suppressPush=false;
        initShowAll(); renderSidebar(); renderView();
        setSync('ok');
        if(!silent) toast('已从云端同步最新数据 ☁️');
      }
    }
    // 关键修复：云端有数据但可能是“空壳”（mood 为空），或云端为空。
    // 本地相框/心情补全：无论本地有无今天的记录，都尝试用同源种子补齐所有历史（按 id 去重，不覆盖本地新增）
    const seeded=await loadSeedIfEmpty();
    setSync((seeded||j&&j.data)?'ok':'off');
    return seeded || !!(j&&j.data);
  }catch(e){ setSync('off'); if(!silent) toast('云端暂时连不上，用的本地数据'); return false; }
}
async function loadSeedIfEmpty(){
  try{
    const localPlen=(DB.mood&&DB.mood.plogs&&DB.mood.plogs.length)||0;
    const localElen=(DB.mood&&DB.mood.entries&&DB.mood.entries.length)||0;
    // 本地已经齐全（≥5张相框且≥2条心情），无需补种子
    if(localPlen>=5 && localElen>=2){ return false; }
    let j=null, seed=window.WITH_SEED_DATA;
    if(!seed){
      const r=await fetch(BACKEND+'/seed-sync.json?t='+Date.now(),{cache:'no-store'});
      if(!r.ok || !r.headers.get('content-length') || Number(r.headers.get('content-length'))<1000){
        return false; // 种子没取到（或被边缘缓存成空壳），下次同步再试，不一次性放弃
      }
      j=await r.json(); seed=j&&j.data; if(!seed) return false;
    }
    if(isEnc(seed)){
      if(!_cryptoKey){ const ok=await ensureKey(); if(!ok) return false; }
      var remoteSeed=await decObj(seed, _cryptoKey);
    } else { var remoteSeed=seed; }
    const before=localPlen+localElen;
    _suppressPush=true;
    DB=mergeDB(DB, remoteSeed);  // 数组合并按 id 去重：历史补全 + 本地今天的记录保留
    DB.updated=Math.max(Number(DB.updated)||0, Number(j.updated)||0);
    save();
    _suppressPush=false;
    const after=((DB.mood&&DB.mood.plogs&&DB.mood.plogs.length)||0)+((DB.mood&&DB.mood.entries&&DB.mood.entries.length)||0);
    initShowAll(); renderSidebar(); renderView();
    return after>before;
  }catch(e){ return false; }
}
function setSync(state){
  const b=document.getElementById('syncBadge'); if(!b) return;
  if(state==='ing'){ b.textContent='☁️ 同步中…'; b.style.color='#c98'; b.style.opacity='.9'; }
  else if(state==='ok'){ b.textContent='☁️ 已同步'; b.style.color='#3a9'; b.style.opacity='.85'; }
  else { b.textContent='📱 仅本地'; b.style.color='#b88'; b.style.opacity='.7'; }
}
function injectSyncBadge(){
  if(document.getElementById('syncBadge')) return;
  const b=document.createElement('div'); b.id='syncBadge';
  b.style.cssText='position:fixed;right:10px;bottom:10px;z-index:9999;font-size:12px;padding:5px 11px;border-radius:999px;background:rgba(255,255,255,.92);color:#b88;box-shadow:0 2px 10px rgba(0,0,0,.15);cursor:pointer;user-select:none;backdrop-filter:blur(4px);font-family:inherit;';
  b.title='点击恢复/同步历史数据（含相框）';
  b.onclick=()=>recoverSeed();
  document.body.appendChild(b);
  setSync('off');
}

/* 一键恢复历史相框/心情：优先用内联种子（不依赖网络），失败再回退 fetch 重试 */
async function recoverSeed(){
  let seed=window.WITH_SEED_DATA;
  if(!seed){
    for(let i=0;i<3;i++){
      try{
        const r=await fetch(BACKEND+'/seed-sync.json?t='+Date.now()+'&r='+i,{cache:'no-store'});
        if(r.ok && Number(r.headers.get('content-length')||0)>1000){ seed=(await r.json()).data; break; }
      }catch(e){}
      await new Promise(s=>setTimeout(s,300));
    }
  }
  if(!seed) return;
  if(isEnc(seed)){
    if(!_cryptoKey){ const ok=await ensureKey(); if(!ok) return; }
    seed=await decObj(seed,_cryptoKey);
  }
  const before=((DB.mood&&DB.mood.plogs&&DB.mood.plogs.length)||0)+((DB.mood&&DB.mood.entries&&DB.mood.entries.length)||0);
  _suppressPush=true;
  DB=mergeDB(DB, seed);
  DB.updated=Math.max(Number(DB.updated)||0, Date.now());
  save();
  _suppressPush=false;
  const after=((DB.mood&&DB.mood.plogs&&DB.mood.plogs.length)||0)+((DB.mood&&DB.mood.entries&&DB.mood.entries.length)||0);
  initShowAll(); renderSidebar(); renderView();
}

/* ===================== 云端同步加密（密码锁） ===================== */
// 数据上传前用 AES-GCM 加密，服务器只存密文；密钥由用户密码经 PBKDF2 派生，不离开本机。
const SYNC_SALT = 'cute-workbench-static-salt-v1';
let _cryptoKey = null;          // 当前会话的 AES 密钥（仅内存）
let _keyPromise = null;         // 等待用户输入密码的 Promise
let _keyResolve = null;         // 解锁弹窗的 resolve 回调
function bufToB64(buf){ const b=new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i++) s+=String.fromCharCode(b[i]); return btoa(s); }
function b64ToBuf(b64){ const s=atob(b64); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return b.buffer; }
async function deriveKey(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2', salt:enc.encode(SYNC_SALT), iterations:120000, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']
  );
}
async function encObj(obj, key){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const plain=enc.encode(JSON.stringify(obj));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, plain);
  return {__enc:true, iv:bufToB64(iv), ct:bufToB64(ct)};
}
async function decObj(payload, key){
  const iv=b64ToBuf(payload.iv); const ct=b64ToBuf(payload.ct);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(plain));
}
function isEnc(p){ return p && p.__enc===true && typeof p.iv==='string' && typeof p.ct==='string'; }
// 确保当前会话有解密密钥：有则直接返回；否则尝试 sessionStorage 里的密码，再不行弹出解锁框
function ensureKey(){
  if(_cryptoKey) return Promise.resolve(true);
  if(_keyPromise) return _keyPromise;
  _keyPromise=new Promise(async (resolve)=>{
    const sp=sessionStorage.getItem('syncPass');
    if(sp){ try{ _cryptoKey=await deriveKey(sp); _keyPromise=null; resolve(true); return; }catch(e){} }
    openUnlockModal(resolve);
  });
  return _keyPromise;
}
function openUnlockModal(resolve){
  _keyResolve=resolve;
  $('#modal').innerHTML=`<button class="close" data-act="closeUnlock">×</button>
    <h3>🔑 输入同步密码</h3>
    <p style="font-size:12px;color:var(--text-soft)">云端数据是加密的，输入密码才能同步。</p>
    <form data-act="doUnlock">
      <input type="password" name="pw" placeholder="输入密码" required style="width:100%;margin:8px 0;padding:10px;border-radius:10px;border:1px solid #f0c5d8">
      <div class="btn-row"><button class="b-pink" type="submit">解锁</button><button class="b-soft" type="button" data-act="closeUnlock">取消</button></div>
    </form>`;
  $('#modalMask').classList.add('show');
}
function openPassModal(){

function initShowAll(){
  const ids=Object.keys(MODULES);
  let migrated=false;
  DB.navOrder=DB.navOrder.filter(id=>ids.includes(id));
  for(const id of ids){
    if(!DB.navOrder.includes(id)){ DB.navOrder.push(id); migrated=true; }
    if(!(id in DB.settings.daily)){ DB.settings.daily[id]=false; migrated=true; }
  }
  if(migrated) save();
  for(const id in MODULES){ if(!(id in ui.showAll)) ui.showAll[id]=!DB.settings.daily[id]; }
}

const READINGS=[
  {title:'微小习惯的安静力量', author:'佚名', en:'We often overestimate what we can finish in one day, yet underestimate what we can build over a year. Real change rarely arrives in a single dramatic moment. Instead, it is shaped quietly by small, repeated actions. Reading ten pages each night, or walking for twenty minutes every morning, is not merely passing time—it is training the person you are becoming. The mind loves comfort, but growth lives at the edge of discomfort. Be patient, and trust the process. A year from now, you will thank the version of yourself that refused to quit on ordinary days.', zh:'我们常高估一天能完成的事，却低估一年能建成的改变。真正的转变很少来自某个戏剧性的瞬间，而是由微小、重复的行动悄悄塑造。每晚读十页书，或每天清晨走二十分钟，不只是消磨时间——而是在训练那个正在成为的自己。心智偏爱安逸，而成长生在不适的边缘。保持耐心，相信过程。一年后，你会感谢那个在平凡日子里没有放弃的自己。', note:'overestimate 高估；underestimate 低估；dramatic 戏剧性的；merely 仅仅；edge 边缘。'},
  {title:'阅读：一种安静的反叛', author:'佚名', en:'In a world that rewards speed, choosing to read slowly is almost a rebellion. A book does not hurry you. It waits, sentence after sentence, until your thoughts catch up with the author’s. Through reading, you borrow other lives and other centuries, learning how people far away once loved, feared, and hoped. This is why a well-read mind rarely feels alone. The page becomes a window, and every window opens onto a wider world than the one you stand in.', zh:'在一个奖赏速度的世界里，选择慢读几乎是一种反叛。书不会催促你。它等着，一句接一句，直到你的思绪追上作者的脚步。通过阅读，你借来别人的人生与别的世纪，了解远方的人曾如何爱、恐惧与期盼。正因如此，饱读之人很少感到孤独。书页成了窗，而每扇窗都通向比你脚下方更广阔的世界。', note:'rebellion 反叛；reward 奖赏；borrow 借；century 世纪；window 窗口（喻视角）。'},
  {title:'保持平静的艺术', author:'佚名', en:'Calm is not the absence of storms; it is the ability to remain steady while the storm passes. When pressure mounts, most people react before they think. The trained mind, however, pauses. It observes the feeling, names it, and then chooses a response instead of a reflex. This small gap between stimulus and reaction is where wisdom lives. You cannot control what happens to you, but you can always decide what happens next. That decision, repeated daily, is the foundation of a peaceful life.', zh:'平静不是没有风暴，而是在风暴掠过时仍能保持稳定的能力。当压力攀升，多数人未经思考便做出反应。而训练有素的心智会先停顿：它观察情绪、为它命名，然后选择回应而非本能。刺激与反应之间这道微小的间隙，正是智慧栖身之处。你无法控制发生在自己身上的事，却总能决定下一步怎么走。这个决定日复一日，便是平和人生的基础。', note:'absence 缺乏；mount 攀升；reflex 本能反应；stimulus 刺激；foundation 基础。'},
  {title:'失败是一位老师', author:'佚名', en:'Nobody plans to fail, yet failure visits everyone who tries anything worthwhile. The difference lies not in avoiding falls, but in what we do afterward. A setback can shrink us into fear, or stretch us into growth—the same event, two destinies. Treat failure as data, not as identity. Ask what it revealed, adjust the approach, and begin again with clearer eyes. History is full of people who were called failures right before they succeeded. Persistence, not perfection, is the real qualification for achievement.', zh:'没人计划失败，但每个尝试有价值之事的人都会被失败造访。差别不在免于跌倒，而在跌倒之后怎么做。挫折既可能把我们缩进恐惧，也可能将我们拉伸向成长——同一件事，两种命运。把失败当作数据，而非标签。问它揭示了什么，调整方法，再带着更清醒的眼睛重新开始。历史满是那些在成功前被称失败的人。坚持，而非完美，才是成就真正的资格。', note:'worthwhile 值得的；setback 挫折；destiny 命运；reveal 揭示；persistence 坚持。'},
  {title:'无聊的礼物', author:'佚名', en:'We fill every quiet moment with screens, afraid of the slightest boredom. Yet boredom is not the enemy of creativity—it is often its doorway. When the mind is not fed constant entertainment, it begins to wander, and wandering thoughts are where original ideas are born. Some of the best solutions arrive while you are doing nothing in particular: washing dishes, walking, or staring out of a train window. Protect a little emptiness in your day. Let your brain get quietly bored, and watch what it makes.', zh:'我们用屏幕填满每个安静的瞬间，生怕哪怕一丝无聊。然而无聊并非创造力的敌人——它常是创造力的门。当心智不再被源源不断的娱乐投喂，它便开始游荡，而游荡的思绪正是原创想法的诞生地。一些最好的解法，出现在你无所事事的时刻：洗碗、散步，或望着车窗外发呆。在一天里护住一点空白，让大脑安静地无聊一会儿，看看它会造出什么。', note:'entertainment 娱乐；wander 游荡；original 原创的；in particular 特别地；emptiness 空白。'},
  {title:'慢慢学一门语言', author:'佚名', en:'Learning a language is less like a sprint and more like tending a garden. You plant words, water them with repetition, and wait through seasons of seeming no progress at all. Then, almost without warning, sentences that once felt impossible start to flow. The mistake is to judge a garden by a single afternoon. Trust the slow buildup. Read a little each day, listen a little each day, and speak without fear of errors. Fluency is not a moment you arrive at; it is a habit you keep.', zh:'学一门语言，不太像短跑，更像是打理一座花园。你种下单词，用重复浇水，熬过看似毫无进展的季节。然后，几乎毫无征兆地，那些曾觉不可能的句子开始自然流淌。错误在于用某一个下午来评判一座花园。相信缓慢的积累：每天读一点，每天听一点，带着不怕犯错的心去说。流利不是你抵达的某个时刻，而是你保持的一种习惯。', note:'sprint 短跑；tend 照料；repetition 重复；fluency 流利；arrive at 抵达。'},
  {title:'好奇心胜过天赋', author:'佚名', en:'Talent opens the first door, but curiosity keeps it open. Many gifted people stall because they stop asking questions, while curious ones keep moving long after the early advantage fades. Curiosity turns ordinary moments into lessons: a broken gadget becomes a puzzle, a foreign phrase becomes an invitation. It costs nothing and travels everywhere. If you want to keep growing, protect your questions as carefully as your answers. The person who asks “why” and “what if” will almost always outlearn the person who merely knows.', zh:'天赋打开第一扇门，而好奇心让门敞着。许多有天赋的人停滞，是因为他们不再提问；而好奇的人，在早年的优势褪去后仍继续前行。好奇心把寻常时刻变成课堂：坏掉的小装置成了谜题，一句外语成了邀请。它不花分文，却能去往任何地方。若想持续成长，请像守护答案一样守护你的问题。那个问"为什么""万一呢"的人，几乎总能胜过只是"知道"的人。', note:'stall 停滞；fade 褪去；gadget 小装置；invitation 邀请；outlearn 学到更多。'},
  {title:'“足够”的财富', author:'佚名', en:'Modern life whispers that more is always better—more money, more speed, more things. But the pursuit of “more” has no natural stopping point, and many who arrive there still feel hollow. The quieter skill is learning the line between need and want. When you know what is enough, you stop running and start living. Wealth, in the end, is not a number in a bank; it is the distance between what you have and what you require. Narrow that gap, and you may find you were rich all along.', zh:'现代生活低语着：更多总更好——更多钱、更快、更多物。但"更多"的追求没有天然的终点，许多抵达那里的人仍觉空虚。更安静的本领，是学会区分需要与想要。当你知道"足够"在哪里，便不再奔跑，开始生活。财富归根结底不是银行里的一个数字，而是你拥有与所需之间的距离。收窄这段距离，你或许会发现，一直以来你都很富有。', note:'pursuit 追求；hollow 空虚的；require 需要；narrow 收窄；all along 一直。'},
  {title:'休息也是生产力', author:'佚名', en:'We praise nonstop work and treat rest as a reward earned only after exhaustion. Yet the brain consolidates memory and sparks insight precisely when we step away from the task. A walk, a nap, or a quiet evening is not lost time—it is part of the work. The best thinkers protect their downtime as fiercely as their deadlines. If you feel stuck, do not push harder; step back. Often the solution appears not while you chase it, but while you have finally allowed yourself to stop.', zh:'我们赞美不停歇的工作，把休息当作耗尽后才配得的奖赏。然而大脑恰恰在我们离开任务时巩固记忆、迸发洞见。一次散步、一场小憩、一个安静的夜晚，并非被浪费的时间——它们是工作的一部分。最优秀的思考者守护放空时光如同守护截止日期。若你卡住了，别更用力地推；退后一步。答案常常不在你追逐它时出现，而在你终于允许自己停下的时刻降临。', note:'consolidate 巩固；insight 洞见；precisely 恰恰；downtime 休息时间；stuck 卡住。'},
  {title:'你身边的圈子', author:'佚名', en:'You become like the people you spend your time with, often without noticing. Optimistic friends normalize hope; anxious ones normalize worry. This is not about judging others, but about choosing your everyday atmosphere with care. Seek companions who ask how you are and mean it, who celebrate your small wins, and who tell you the truth kindly. A few such people are worth more than a thousand acquaintances. Surround yourself with growth, and growth begins to feel like the default setting of your life.', zh:'你会在不经意间，变得像那些朝夕相处的人。乐观的朋友让希望成为常态，焦虑的朋友让担忧成为常态。这不是要评判他人，而是提醒你谨慎选择日常的氛围。去寻找那些会真心问你"还好吗"、为你的小成就喝彩、且善意说出真相的同伴。这样几个人，胜过一千个泛泛之交。让成长环绕自己，成长便开始像你人生的默认设置。', note:'normalize 使…成为常态；companion 同伴；acquaintance 泛泛之交；surround 环绕；default 默认。'},
  {title:'时间才是真正的货币', author:'佚名', en:'Money can be earned again, but the hour you spent cannot be withdrawn from any bank. We guard our wallets carefully and hand our hours to distractions almost for free. Yet time is the one resource that spends itself whether we choose or not. The question is not how much time you have, but what you trade it for. A life feels rich not when every minute is filled, but when the minutes are filled with what matters. Spend your attention like the scarce treasure it is.', zh:'钱可以再赚，但你花掉的那个小时，却无法从任何银行取回。我们小心守护钱包，却几乎免费地把时间交给分心之物。然而时间是一种不论你选或不选都会自行流逝的资源。问题不在于你有多少时间，而在于你拿它换了什么。人生之富足，不在于每分钟都被填满，而在于那些分钟装进了要紧的事。像对待稀缺的珍宝那样，花掉你的注意力。', note:'withdraw 取回；distraction 分心；scarce 稀缺的；treasure 珍宝；trade for 交换。'},
  {title:'温柔地表达', author:'佚名', en:'Honesty and kindness are often framed as opposites, as if telling the truth must hurt. But the sharper skill is to speak clearly and warmly at once. You can say “this worries me” without saying “you are wrong.” You can set a boundary without building a wall. People remember not only what you said, but how safe they felt hearing it. Practice the sentence that is true and tender together. Over time, your words become a place others trust—and trust, once earned, is its own quiet power.', zh:'诚实与善意常被框为对立面，仿佛说真话就必须伤人。但更利落的本领，是同时清晰又温暖地表达。你可以说"这让我担心"，而不必说"你错了"；可以划出边界，而不必筑起高墙。人们记住的不仅是你说了什么，还有听你说话时感到的安稳。练习把真实与温柔写进同一句话。久而久之，你的言语成了一个别人信任的地方——而信任一旦赢得，便是它自身安静的力量。', note:'frame 框定；boundary 边界；tender 温柔的；earn 赢得；opposite 对立面。'},
  {title:'打一场持久战', author:'佚名', en:'Anything meaningful takes longer than expected, and that is not a bug but the design. Skills deepen with reps, relationships with shared winters, and character with quiet tests no one sees. Those who quit early mistake the normal slowness for failure. Play the long game: show up today not because today will be dramatic, but because today is one more brick. You will not feel the cathedral while laying the third stone. Keep laying. The shape arrives later, almost as a surprise, to those who simply refused to stop.', zh:'任何有意义的事都比预期更久，这不是 bug，而是设定。技能在重复中加深，关系在共渡的寒冬里结实，品格在无人看见的安静考验中成形。早早放弃的人，把正常的缓慢误认成失败。玩长线游戏吧：今天出现，不是因为今天会有戏剧性，而是因为今天是又一块砖。砌第三块石时，你不会感到那座大教堂。继续砌。轮廓会在后来几乎以惊喜的姿态降临——降临于那些只是拒绝停下的人。', note:'rep 重复；character 品格；cathedral 大教堂；mistake 误认；refuse 拒绝。'},
  {title:'倾听是一份礼物', author:'佚名', en:'Most people listen with the intent to reply, not to understand. We rehearse our answer while the other person is still speaking, and so we miss the actual message. True listening is rare and therefore precious. It says, without words, “you matter.” Put down the phone, meet the eyes, and let the silence between sentences exist. When you listen fully, people tell you more—not only facts, but feelings. In a noisy world, the ability to truly hear another person is a quiet superpower worth cultivating.', zh:'多数人倾听，是为了回应，而非为了理解。对方还在说话，我们已在排练答案，于是错过了真正的信息。真正的倾听稀少，因而珍贵。它无需言语便说："你重要。"放下手机，目光相接，让句子之间的沉默存在。当你全然倾听，人们会告诉你更多——不只是事实，还有感受。在喧嚣的世界里，真正听见另一个人的能力，是值得培养的安静超能力。', note:'intent 意图；rehearse 排练；precious 珍贵的；cultivate 培养；noisy 喧嚣的。'},
  {title:'在准备好之前就开始', author:'佚名', en:'Waiting to feel ready is one of the most effective ways to never begin. Readiness is not a prerequisite that arrives; it is a feeling that follows action. The first page is always the hardest, and the first sentence always the clumsiest. Do not wait for confidence to lead—let movement create it. Start the project, the habit, the conversation, even imperfectly. Courage is not the absence of fear but the decision to begin while fear is still in the room. The door opens after you step, not before.', zh:'等待"感到准备好"，是最有效的永不开始之法。准备好不是先来到的前提，而是行动之后才有的感受。第一页总是最难，第一句总是最笨拙。别等信心带路——让行动创造它。开始那个项目、那个习惯、那场对话，哪怕不完美。勇气不是没有恐惧，而是恐惧仍在屋里时仍决定开始。门在你迈步之后才开，而非之前。', note:'prerequisite 前提；clumsy 笨拙的；confidence 信心；conversation 对话；in the room 在场。'},
  {title:'一个小小的日常仪式', author:'佚名', en:'Happiness is rarely a grand event; more often it is a series of small rituals we repeat on purpose. A morning cup of tea, a short walk after lunch, a line written before sleep. These tiny anchors steady a day that would otherwise slip past unnamed. You do not need a vacation to feel alive; you need a few moments you can count on. Design one small ritual this week and protect it. The life you want is not somewhere far away—it is built, gently, from the ordinary hours you choose to mark as yours.', zh:'幸福很少是盛大事件，更多时候是我们刻意重复的一系列小仪式：清晨的一杯茶，午后的一次短步，睡前写下的那一行。这些小小的锚，稳住了本会无名溜走的一天。你不需要一场假期才觉活着，你需要几个可以指望的瞬间。本周设计一个小仪式并守护它。你想要的生活不在远方——它温柔地，由那些你选择标记为"属于自己"的寻常时光筑成。', note:'ritual 仪式；anchor 锚；steady 稳住；on purpose 刻意；slip past 溜走。'},
  {title:'数字极简主义', author:'佚名', en:'Our phones buzz with notifications we never asked for. Apps compete for our attention as if it were a resource to be mined. Digital minimalism is the practice of questioning which tools truly serve your values, and quietly removing the rest. It is not about rejecting technology, but about using it with intention. Start by deleting the apps you open out of habit rather than need. Turn off all but the most essential alerts. You may fear missing out, yet most people report the opposite: a calmer mind and deeper focus. The goal is not a blank screen, but a screen that earns its place in your life.', zh:'我们的手机被从未主动要求的通知震动个不停。各类应用争相抢夺注意力，仿佛那是待开采的资源。数字极简主义，就是去追问哪些工具真正服务于你的价值，再悄悄移除其余。它不是拒绝科技，而是有意为之地使用它。从删掉那些因习惯而非需求才打开的应用开始，关掉除最必要之外的所有提醒。你或许担心错失，然而多数人反馈的恰恰相反：更平静的心绪与更深的专注。目标不是一片空白的屏幕，而是一块在你生活中"配得上其位置"的屏幕。', note:'notification 通知；minimalism 极简主义；intention 意图；essential 必要的；earn 赢得。'},
  {title:'脆弱是一种力量', author:'佚名', en:'We are taught to hide weakness and appear composed. Yet research suggests that admitting uncertainty can strengthen trust, not weaken it. When a leader says "I do not have all the answers," teams often feel safer to speak up. Vulnerability is not the same as helplessness; it is the courage to be seen as you are. Of course, context matters—oversharing with strangers may backfire. But with people you trust, letting your guard down can deepen connection. The strongest relationships are rarely built on perfection, but on the honesty of two imperfect people.', zh:'我们被教导要藏起软弱、显得从容。然而研究表明，承认不确定反而能增强信任，而非削弱它。当一位领导者说"我并非全知"，团队往往更敢开口。脆弱不同于无助，它是"被如实地看见"的勇气。当然，分寸很重要——对陌生人过度袒露可能适得其反。但在你信任的人面前，放下防备能加深联结。最牢固的关系很少建立在完美之上，而建立在两个不完美之人的坦诚之中。', note:'composed 从容的；uncertainty 不确定；vulnerability 脆弱；backfire 适得其反；imperfect 不完美的。'},
  {title:'如何写出清晰的文章', author:'佚名', en:'Good writing is not about fancy words; it is about clear thinking. Before you type, decide the single point you want the reader to remember. Then say it plainly, in the shortest honest sentence you can. Avoid piling clauses that force the reader to hold their breath. Read your draft aloud—if you stumble, the sentence is too long. Cut every adjective that does no work. Replace vague nouns with specific ones. Writing is rewriting, so expect to revise more than once. In the end, respect the reader’s time, and they will reward you with their attention.', zh:'好文章不靠花哨的词，而靠清晰的思考。动笔前，先想清楚你希望读者记住的唯一要点。然后用你能写出的最短而诚实的句子，平实地说出来。避免堆砌从句，逼读者屏住呼吸。把草稿朗读出来——若你磕绊，那句便太长。删掉每一个不干活的形容词，用具体的名词替换含糊的。写作即重写，所以要做好反复修改的准备。归根结底，尊重读者的时间，他们便会以注意力回报你。', note:'fancy 花哨的；clause 从句；draft 草稿；stumble 磕绊；revise 修改。'},
  {title:'为什么睡眠不是浪费', author:'佚名', en:'In a culture that glorifies busyness, sleep is often treated as lost time. But during sleep, the brain sorts the day’s memories, clears waste, and resets mood. Skimp on it, and attention frays, decisions sour, and emotions flare. A consistent schedule matters more than total hours: waking at the same time trains your internal clock. Screens before bed delay sleep by suppressing melatonin. If you cannot fall asleep, get up and read something calm rather than staring at the ceiling. Protect sleep not as a luxury, but as the foundation that makes the waking hours worthwhile.', zh:'在一个崇尚"忙碌"的文化里，睡眠常被当作被浪费的时间。然而在睡眠中，大脑整理白天的记忆、清除废物、重置情绪。亏待它，注意力便会涣散，决策变差，情绪易爆。规律的作息比总时长更重要：固定时间起床能训练你的生物钟。睡前的屏幕通过抑制褪黑素而推迟入睡。若睡不着，起身读点平静的东西，好过盯着天花板。把睡眠当作基石而非奢侈品来保护——它让清醒的时光值得一过。', note:'glorify 赞美；fray 涣散；melatonin 褪黑素；suppress 抑制；worthwhile 值得的。'},
  {title:'深度工作的回报', author:'佚名', en:'Shallow work—emails, chats, tiny tasks—keeps us busy but rarely moves us forward. Deep work is the focused, undistracted effort that produces real value. It is uncomfortable at first, because the mind craves novelty. But like a muscle, focus strengthens with use. Try protecting a single block of ninety minutes each day, phone in another room, for one task only. You will be surprised how much clearer thinking becomes. In an age of constant interruption, the ability to concentrate deeply is becoming rare—and therefore precious.', zh:'浮浅工作——邮件、聊天、琐碎任务——让我们忙个不停，却很少推动我们前进。深度工作，是专注而无干扰、能创造真实价值的努力。起初它令人不适，因为心智渴求新鲜感。但专注如肌肉，越用越强。试着每天守住一段九十分钟的整块时间，手机放在另一个房间，只做一件事。你会惊讶于思维变得多么清晰。在一个不断被打断的时代，深度专注的能力正变得稀缺——因而愈发珍贵。', note:'shallow 浮浅的；undistracted 不分心的；crave 渴求；novelty 新鲜感；interruption 打断。'},
  {title:'把批评变成礼物', author:'佚名', en:'Criticism stings, especially when it feels unfair. The first instinct is to defend. But a useful habit is to pause and separate the message from the messenger. Even a harsh comment may contain one true point worth keeping. Ask yourself what you could do differently, not whether the person was kind. Not all feedback deserves action—some reflects the giver more than you. Yet dismissing everything closes the door to growth. The skilled learner filters quickly, keeps what helps, and lets the rest pass like weather.', zh:'批评令人刺痛，尤其当它显得不公。第一反应往往是防卫。但一个有用的习惯是：先停顿，把"内容"与"传递者"分开。即便尖锐的评论，也可能藏着一条值得保留的真理。问自己"我能有什么不同做法"，而非"对方是否善意"。并非所有反馈都值得行动——有些更多折射出给予者而非你。然而一概拒之，便关上了成长之门。高明的学习者快速筛选，留下有用的，让其余如天气般掠过。', note:'sting 刺痛；defend 防卫；harsh 尖锐的；feedback 反馈；dismiss 摒弃。'},
  {title:'旅行教给我们的', author:'佚名', en:'Travel is not only about photos in new places. It is about being a beginner again—lost, dependent, and quietly amazed. When the usual rules no longer apply, you notice how much you took for granted: language, directions, small kindnesses. Strangers become generous; a shared smile needs no translation. You return not with a changed passport alone, but with a softer certainty that the world holds many right ways to live. The best trips do not escape life; they remind you how to pay attention to it.', zh:'旅行不止是新地方的照片。它是重新做一名初学者——迷路、依赖、又悄悄惊叹。当熟悉的规则不再适用，你才注意到自己曾把多少事视为理所当然：语言、方向、微小的善意。陌生人变得慷慨；一个共通的微笑无需翻译。你归来时，改变的不仅是护照，更是一种更柔软的确信：世界上有许多种"正确"的生活方式。最好的旅程不是逃避生活，而是提醒你如何用心留意它。', note:'beginner 初学者；take for granted 视为理所当然；generous 慷慨的；certainty 确信；escape 逃避。'},
  {title:'把心安放在此刻', author:'佚名', en:'The mind spends much of its time elsewhere—replaying the past or rehearsing the future. Yet life is only ever happening now. Mindfulness is the simple practice of returning attention to the present: the warmth of a cup, the sound of rain, the breath moving in and out. You need no special posture, only willingness to notice. When worries rise, label them gently and return. Over weeks, this small habit loosens the habit of rumination. You cannot stop the waves, but you can learn to float. Peace, it turns out, is not far away—it is here, one breath at a time.', zh:'心智大半时间都在别处——重播过去或排练未来。然而生活只在此刻发生。正念，无非是把注意力带回当下的简单练习：一杯的温热、雨声、进出的呼吸。你无需特殊姿势，只需愿意去觉察。当忧虑升起，轻轻为它命名，再回来。数周之后，这个小习惯会松开反刍的惯性。你无法阻止浪，却可以学会漂浮。原来平静并不遥远——它在此处，一次呼吸，又一次呼吸。', note:'replay 重播；rehearse 排练；mindfulness 正念；rumination 反刍/反复思虑；float 漂浮。'},
/* TED 演讲精华（双语，离线可读） */
{title:'脆弱的力量', author:'Brené Brown · TED', src:'TED', en:"Brené Brown spent years studying vulnerability, and what she found overturned her own assumptions. We live in a culture that tells us vulnerability is weakness, yet the data points the other way: vulnerability is actually the birthplace of love, belonging, joy, and creativity. The people who feel most connected are the ones willing to be seen, imperfections and all. Numbing the hard emotions does not selectively work—when we numb fear and shame, we also numb joy and gratitude. The courage to be imperfect, to say 'I love you' first, to do something where there are no guarantees—that is where wholehearted living begins.", zh:'布琳·布朗花数年研究"脆弱"，结果推翻了她自己的假设。我们身处的文化告诉我们脆弱是软弱，但数据指向相反的方向：脆弱其实是爱、归属、喜悦与创造力的诞生地。那些感到最联结的人，正是愿意被看见的人，连同所有不完美。麻痹难受的情绪并不会"选择性生效"——当我们麻痹恐惧与羞耻，也一并麻痹了喜悦与感恩。敢于不完美、敢先说"我爱你"、敢做没有保证的事——全心全意的生活正由此开始。', note:'vulnerability 脆弱；assumption 假设；birthplace 诞生地；numb 麻痹；wholehearted 全心全意的。'},
{title:'从"为什么"开始', author:'Simon Sinek · TED', src:'TED', en:"Simon Sinek noticed that great leaders and companies all communicate in the opposite direction from everyone else. Most people start with what they do, then how, and rarely reach why. But inspiring leaders begin with why—a purpose, a cause, a belief. The 'Golden Circle' explains why some organizations move people while others do not. It is not about facts and features; people do not buy what you make, they buy why you make it. When you start with why, you attract those who believe what you believe—and that shared belief is what turns customers into loyal followers.", zh:'西蒙·斯涅克发现，伟大的领导者与公司，沟通方向与常人相反。多数人从"做什么"开始，再到"怎么做"，却很少触及"为什么"。而鼓舞人心的领导者从"为什么"开始——一个目的、一个缘由、一份信念。"黄金圈"解释了为何有些组织能打动人，有些却不能。关键不在事实与功能：人们买的不是你做什么，而是你为什么做。当你从"为什么"出发，便吸引来那些与你信念相同的人——正是这份共同信念，把顾客变成忠实的追随者。', note:'communicate 沟通；inspiring 鼓舞人心的；feature 功能；loyal 忠实的；attract 吸引。'},
{title:'拖延症患者的大脑', author:'Tim Urban · TED', src:'TED', en:"Tim Urban realized that the brain of a chronic procrastinator contains an Instant Gratification Monkey that hijacks the steering wheel, abandoning long-term goals for easy, fun tasks. The Rational Decision-Maker is left helpless—until the Panic Monster appears. The Panic Monster is the only thing the monkey fears, and it awakens whenever a deadline looms or public embarrassment threatens. The problem with long-term projects is that the monster never shows up, so we surf the internet while quietly ruining our future selves. The antidote is simple: notice the monkey, and shrink every big task into the smallest possible first step.", zh:'蒂姆·厄本发现，拖延症患者的大脑里住着一只"即时满足猴"，它会抢走方向盘，为了轻松有趣的事抛下长期目标，留下"理性决策者"无能为力——直到"恐慌怪兽"出现。恐慌怪兽是猴子唯一害怕的东西，它在截止日逼近或当众出丑的威胁降临时苏醒。长期项目的问题在于怪兽从不出现，于是我们一边上网冲浪，一边悄悄毁掉未来的自己。解药很简单：察觉那只猴子，并把每个大任务拆成尽可能小的第一步。', note:'chronic 长期的；gratification 满足；hijack 劫持；deadline 截止日；antidote 解药。'},
{title:'坚毅：激情与毅力', author:'Angela Duckworth · TED', src:'TED', en:"Angela Duckworth left a high-flying consulting job to teach seventh graders math, and she noticed something puzzling: the most successful students were not always the most talented. Some naturally gifted kids struggled, while others with average ability pushed through. After years of research across cadets, salespeople, and students, one trait predicted success more than IQ or talent: grit. Grit is passion and perseverance for long-term goals—the stamina to keep going after failure, to treat life as a marathon rather than a sprint. Talent is how quickly you improve with effort, but effort counts twice: it builds skill, and then turns skill into achievement.", zh:'安杰拉·达克沃斯离开光鲜的咨询工作去教初一数学，她发现一件令人困惑的事：最成功的学生未必最有天赋。一些天赋出众的孩子苦苦挣扎，而能力平平者却坚持下来。经过多年对学员、销售与学生的研究，有一个特质比智商或天赋更能预测成功：坚毅。坚毅是对长期目标的激情与毅力——在失败后继续前行的耐力，把人生当作马拉松而非短跑。天赋决定你努力时进步的快慢，但努力要算两次：它构建技能，再把技能转化为成就。', note:'puzzling 令人困惑的；gifted 有天赋的；perseverance 毅力；stamina 耐力；achievement 成就。'},
{title:'身体语言塑造你自己', author:'Amy Cuddy · TED', src:'TED', en:"Amy Cuddy's research asks a simple question: does our body language affect how others see us, and also how we see ourselves? Power poses—expanding the body, taking up space—have measurable effects: after just two minutes, they lower stress hormones and raise confidence markers. The finding is not about faking strength to impress others, but about genuinely changing your own physiology. Her advice is the two-minute rule: before a stressful situation, stand like Wonder Woman in private. You may not yet feel confident, but tiny postural changes can nudge your mind to catch up. 'Fake it till you become it.'", zh:'艾米·卡迪的研究提出了一个简单的问题：身体语言是否影响别人对我们的看法，也影响我们对自己的看法？力量姿势——舒展身体、占据空间——有可测量的效果：仅两分钟后，压力激素下降，自信指标上升。这个发现并非教你假装强大去取悦他人，而是真正改变自身的生理状态。她的建议是"两分钟法则"：在压力情境前，私下像神奇女侠那样站立。你也许还没感到自信，但微小的姿态改变能推动心智跟上。"假装，直到你成为它。"', note:'measurable 可测量的；hormone 激素；physiology 生理；postural 姿态的；nudge 推动。'},
{title:'成长型思维的力量', author:'Carol Dweck · TED', src:'TED', en:"Carol Dweck identified two mindsets that shape how people approach challenge. In a fixed mindset, people believe ability is set—you either have it or you don't, so failure means 'I'm not good enough.' In a growth mindset, people believe abilities can be developed through effort and strategy, so failure becomes information about what to try next. The word that signals growth is 'yet': not 'I can't do this,' but 'I can't do this yet.' Praising intelligence can actually shrink children's willingness to take risks, while praising effort and process builds resilience. When we reframe difficulty as the workout that grows the brain, learning stops being a verdict and becomes a path.", zh:'卡罗尔·德韦克发现了两种影响人们面对挑战的思维模式。固定型思维的人相信能力是天定的——你有就是有，没有就是没有，于是失败意味着"我不够好"。成长型思维的人相信能力可以通过努力和策略发展，于是失败变成了"下一步该试什么"的信息。标志着成长的词是"还"：不是"我做不到"，而是"我还做不到"。夸赞聪明反而会减少孩子冒险的意愿，而夸赞努力与过程则建立韧性。当我们把困难重新框定为锻炼大脑的"训练"，学习就不再是判决，而成为一条路径。', note:'mindset 思维模式；fixed 固定的；strategy 策略；resilience 韧性；verdict 判决。'},
{title:'快乐的优势', author:'Shawn Achor · TED', src:'TED', en:"Shawn Achor argues that we have the formula backwards. We think success leads to happiness, but the brain actually works the other way: a positive brain performs better on nearly every measure—creativity, energy, productivity. If happiness is the goal, we should raise optimism in the present, not chase it after the next achievement. His research found that small daily habits rewire the brain over three weeks: write down three gratitudes, journal one positive experience, exercise, meditate, and send a kind email. Happiness, it turns out, is not the finish line of success; it is the starting line of performance.", zh:'肖恩·阿克尔认为我们把公式弄反了。我们以为成功会带来快乐，但大脑其实反过来运作：积极的大脑在几乎每一项指标上都表现更好——创造力、精力、生产力。如果快乐是目标，我们应该在当下提升乐观，而非等到下一个成就之后。他的研究发现，一些小小的日常习惯能在三周内重塑大脑：写下三件感恩、记录一段正向经历、运动、冥想、发一封善意的邮件。原来快乐并非成功的终点线，而是表现的起跑线。', note:'formula 公式；optimism 乐观；achievement 成就；journal 记日记；meditate 冥想。'},
{title:'尝试新事物30天', author:'Matt Cutts · TED', src:'TED', en:"Matt Cutts offers a tiny, practical idea: try something new for 30 days. The logic is that 30 days is just long enough to form a habit and just short enough to feel approachable. Instead of vague year-long resolutions that quietly fade by February, pick one concrete challenge: take a photo every day, write 1,500 words, bike to work, give up sugar. Two things tend to happen. First, the days become more memorable, because each one contains a small new thread. Second, self-confidence grows as you prove, month after month, that you can keep a promise to yourself. Small changes, sustained, are anything but small.", zh:'马特·卡茨提出了一个小而实用的点子：用30天尝试一件新事。逻辑是，30天既够长以养成习惯，又够短以让人觉得可亲近。与其立下模糊的年度决心、到二月便悄悄消散，不如挑一个具体的挑战：每天拍一张照、写1500字、骑车上班、戒糖。往往有两件事会发生：其一，日子变得更难忘，因为每一天都多了一条小小的新的线索；其二，自信心会增长，因为你一个月接一个月地向自己证明：你能对自己信守承诺。微小的改变，若能持续，就一点都不小。', note:'approachable 可亲近的；vague 模糊的；resolution 决心；concrete 具体的；sustain 持续。'}

/* 每日阅读：多关卡选择题小测验（基于文章生词，确定性生成不跳变） */
let _ALL_WORDS=null;
function parseNote(note){
  if(!note) return [];
  const out=[];
  note.split('；').forEach(part=>{
    part=part.trim(); if(!part) return;
    const sp=part.indexOf(' ');
    if(sp<0){ out.push({word:part,cn:part}); return; }
    const word=part.slice(0,sp).trim(), cn=part.slice(sp+1).trim().replace(/[。，]$/,'');
    if(word) out.push({word,cn});
  });
  return out;
}
function allWords(){
  if(_ALL_WORDS) return _ALL_WORDS;
  const set=[], seen=new Set();
  READINGS.forEach(r=> parseNote(r.note).forEach(w=>{ if(!seen.has(w.cn)){ seen.add(w.cn); set.push(w); } }));
  _ALL_WORDS=set; return _ALL_WORDS;
}
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function seededShuffle(arr,seed){
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){ seed=(seed*1103515245+12345)&0x7fffffff; const j=seed%(i+1); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function escapeRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
const READ_QSTAGES=['第1关 · 看词选义','第2关 · 看义选词','第3关 · 句子填空'];
const READ_DECOYS=[{w:'vivid',cn:'生动的'},{w:'gentle',cn:'温柔的'},{w:'ordinary',cn:'平凡的'},{w:'brave',cn:'勇敢的'},{w:'silent',cn:'安静的'},{w:'ancient',cn:'古老的'},{w:'tender',cn:'柔软的'},{w:'calm',cn:'平静的'},{w:'noble',cn:'高尚的'},{w:'humble',cn:'谦逊的'}];
function articleWords(r){
  if(r.words && r.words.length) return r.words.map(x=>({word:x.w||x.word, cn:x.cn}));
  return parseNote(r.note);
}
function rqOpts(correct, decoyPool, seed){
  const d=seededShuffle(decoyPool, seed).slice(0,3);
  return seededShuffle([correct, d[0], d[1], d[2]], (seed^0x9e3779b9)>>>0);
}
function rqSentences(r, words, seed){
  const text = r.en || '';
  if(!text) return [];
  const sentences=text.split(/(?<=[.!?])\s+/).filter(s=>s.length<220 && s.length>24);
  const out=[];
  const targets = (words && words.length) ? words : null;
  for(const sent of sentences){
    if(out.length>=3) break;
    let word=null, re=null;
    if(targets){
      for(const w of targets){
        const rx=new RegExp('\\b'+escapeRe(w.word)+'\\b','i');
        if(rx.test(sent)){ word=w.word; re=rx; break; }
      }
    } else {
      // 没有现成生词时，取句中较长的英文词填空，保证有题可做
      const m=sent.match(/[A-Za-z]{5,}/g);
      if(m){ m.sort((a,b)=>b.length-a.length); word=m[0]; re=new RegExp('\\b'+escapeRe(word)+'\\b','i'); }
    }
    if(word) out.push({type:'blank', word:word, prompt:'填空：'+sent.replace(re,'______'), answer:word});
  }
  return out;
}
function buildReadStages(r){
  const words=articleWords(r);
  const hasWords = words && words.length>=2;
  const decoy = hasWords ? words.map(x=>({w:x.word,cn:x.cn})).concat(READ_DECOYS) : READ_DECOYS;
  const seed=hashStr(r.title||'x');
  const stages=[];
  if(hasWords){
    const s1=[], s2=[];
    words.slice(0,3).forEach((w,qi)=>{
      const d1=decoy.filter(x=>x.cn!==w.cn).map(x=>x.cn);
      s1.push({type:'w2cn', prompt:`「${esc(w.word)}」 是什么意思？`, options:rqOpts(w.cn, d1, seed+qi*7+1), answer:w.cn, picked:null, ok:null});
      const d2=decoy.filter(x=>x.w!==w.word).map(x=>x.w);
      s2.push({type:'cn2w', prompt:`「${esc(w.cn)}」 对应的单词是？`, options:rqOpts(w.word, d2, seed+qi*7+2), answer:w.word, picked:null, ok:null});
    });
    stages.push(s1,s2);
  }
  // 第三关「句子填空」：有生词就用生词，没有就取长词，英文正文都能出
  const s3=rqSentences(r, hasWords?words:[], seed+99).map(q=>({...q, options:rqOpts(q.answer, decoy.filter(x=>x.w!==q.answer).map(x=>x.w), seed+200), picked:null, ok:null}));
  if(s3.length) stages.push(s3);
  return stages.length?stages:null;
}
function readingQuizPanel(r){
  const key=r.title;
  const g=ui.readQuiz[key];
  const words=articleWords(r);
  if(!words || words.length<2){
    return `<div class="read-quiz"><div class="rq-head">💡 这篇生词较少，先静心读一读吧～</div></div>`;
  }
  if(!g || g.phase==='idle'){
    return `<div class="read-quiz">
      <div class="rq-head">💡 小测验 · 选择题闯关</div>
      <p class="mute" style="margin:8px 0 12px">用本篇生词玩几关，闯完记得更牢 🌟</p>
      <button class="b-pink rq-start" data-act="readQuizStart" data-key="${esc(key)}">▶ 开始复习</button>
    </div>`;
  }
  if(g.phase==='done'){
    const pct=Math.round(g.score/g.total*100);
    return `<div class="read-quiz">
      <div class="rq-head">🏆 复习完成！</div>
      <div class="rq-result">总得分 <b>${g.score}</b> / ${g.total} <span class="mute">(${pct}%)</span></div>
      <div class="rq-emoji">${pct===100?'🌟 全对，词汇小达人！':pct>=70?'🎉 很棒，常回看更稳':'💪 多来几轮就记住啦'}</div>
      <button class="b-pink rq-start" data-act="readQuizReplay" data-key="${esc(key)}">🔁 再复习一次</button>
    </div>`;
  }
  if(g.phase==='stageDone'){
    const s=g.stage, got=g.stages[s].filter(q=>q.ok).length, tot=g.stages[s].length, last=s>=g.stages.length-1;
    return `<div class="read-quiz">
      <div class="rq-head">${READ_QSTAGES[s]||('第'+(s+1)+'关')} 完成 🎊</div>
      <div class="rq-result">本关 <b>${got}</b> / ${tot} 正确</div>
      <div class="rq-emoji">${got===tot?'✨ 完美通关！':got>=Math.ceil(tot*0.6)?'👍 不错，下一关继续':'💡 错题记得回头看哦'}</div>
      <button class="b-pink rq-start" data-act="${last?'readQuizFinish':'readQuizNextStage'}" data-key="${esc(key)}">${last?'查看总成绩 🏆':'进入下一关 ▶'}</button>
    </div>`;
  }
  // playing
  const qs=g.stages[g.stage], q=qs[g.i], meta=READ_QSTAGES[g.stage]||('第'+(g.stage+1)+'关');
  let optsTxt='';
  q.options.forEach((o,oi)=>{
    let cls='eng-opt';
    if(q.picked!==null){ if(o===q.answer) cls+=' correct'; else if(oi===q.picked) cls+=' wrong'; }
    optsTxt+=`<button class="${cls}" data-act="readQuizAnswer" data-key="${esc(key)}" data-q="${g.i}" data-opt="${oi}" ${q.picked!==null?'disabled':''}>${esc(o)}</button>`;
  });
  const fb = q.picked!==null ? `<div class="eng-fb ${q.ok?'ok':'no'}">${q.ok?'✅ 答对了！':'❌ 正确答案：'+esc(q.answer)}</div>` : '';
  const nb = q.picked!==null ? `<button class="b-soft eng-next" data-act="readQuizNext" data-key="${esc(key)}">${g.i+1>=qs.length?'本关完成 🎊':'下一题 →'}</button>` : '';
  return `<div class="read-quiz">
    <div class="rq-head">${meta} <span class="mute" style="font-size:12px">第 ${g.i+1}/${qs.length} 题</span></div>
    <div class="eng-q">${q.prompt}</div>
    <div class="eng-opts">${optsTxt}</div>
    ${fb}${nb?('<div style="margin-top:12px">'+nb+'</div>'):''}
  </div>`;
}

function openAppOrWeb(a){
  const scheme=a.getAttribute('data-scheme');
  const web=a.getAttribute('data-web');
  if(!scheme){ window.open(web,'_blank','noopener'); return; }
  const t=Date.now(); let gone=false;
  const vis=()=>{gone=true;};
  document.addEventListener('visibilitychange', vis, {once:true});
  try{ window.location.href=scheme; }catch(e){}

  }, 2500);
}

function parseLrc(t){
  const out=[];
  (t||'').split('\n').forEach(line=>{
    const m=line.match(/\[(\d+):(\d+)(?:[.:](\d+))?\]/);
    if(m){ const t=(+m[1])*60+(+m[2])+(+(m[3]||0))/100; out.push({t,text:line.replace(/\[\d+:\d+(?:[.:]\d+)?\]/g,'').trim()}); }
  });
  return out;
}
function fmtTime(s){ if(!isFinite(s))return '0:00'; s=Math.floor(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

  a.load();
  fetch(METING+'lrc&id='+s.id).then(r=>r.text()).then(t=>{
    player.lyrics=parseLrc(t);
    if(player.lrcEl) renderLyrics();
