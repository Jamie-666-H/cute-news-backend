let _wxPos=null;        // 已获得的经纬度 {lat,lon}
let _wxTimer=null;
function initWeather(){
  const chip=$('#weatherChip'); if(!chip) return;
  if(!('geolocation' in navigator)){
    chip.querySelector('.weather-inner').innerHTML='<span class="weather-loading">设备不支持定位</span>';
    return;
  }
  chip.querySelector('.weather-inner').innerHTML='<span class="weather-loading">📍 定位中…</span>';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      _wxPos={lat:pos.coords.latitude, lon:pos.coords.longitude};
      renderWeather();
      if(!_wxTimer) _wxTimer=setInterval(renderWeather,600000); // 每 10 分钟刷新
    },
    err=>{
      const msg = err && err.code===1 ? '点我允许定位 🌤️' : '点我开启天气 🌤️';
      chip.querySelector('.weather-inner').innerHTML='<span class="weather-loading">'+msg+'</span>';
    },
    {enableHighAccuracy:false, timeout:8000, maximumAge:600000}
  );
}
function renderWeather(){
  const chip=$('#weatherChip'); if(!chip) return;
  if(!_wxPos){ initWeather(); return; }
  fetch(BACKEND+'/api/weather?lat='+_wxPos.lat+'&lon='+_wxPos.lon)
    .then(r=>r.json())
    .then(d=>{
      if(!d || !d.ok || d.temp==null){
        chip.querySelector('.weather-inner').innerHTML='<span class="weather-loading">🌧️ 天气获取失败</span>';
        return;
      }
      chip._temp=Math.round(d.temp); chip._emoji=d.emoji; chip._desc=d.desc;
      paintWeather(chip);  // 先画天气，城市名异步补
      // 城市名：前端用 BigDataCloud 反向地理编码（CORS，手机可直连；后端美国节点连不通）
      fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+_wxPos.lat+'&longitude='+_wxPos.lon+'&localityLanguage=zh')
        .then(r=>r.json())
        .then(g=>{
          // 拼成「深圳市南山区」->「深圳南山区」这种市+区格式，更可爱
          const city = g.city || g.locality || g.principalSubdivision || '';
          const locality = g.locality || '';
          let label = city ? city.replace(/市$/,'') : '';
          if(locality && locality !== city) label += locality;
          if(label){ chip._city = label; paintWeather(chip); }
        })
        .catch(()=>{});   // 城市失败不影响天气显示
    })
    .catch(()=>{ chip.querySelector('.weather-inner').innerHTML='<span class="weather-loading">🌧️ 天气获取失败</span>'; });
}
function paintWeather(chip){
  if(chip._temp==null) return;
  const city=chip._city?('<span class="weather-city">'+esc(chip._city)+'</span>'):'';
  chip.querySelector('.weather-inner').innerHTML='<span class="weather-emoji">'+chip._emoji+'</span>'+
    '<span class="weather-info"><span class="weather-temp">'+chip._temp+'°</span>'+city+'</span>';
  chip.title=(chip._city?chip._city+' · ':'')+chip._desc;
}
/* 手机端：时间和天气可以自由拖动摆位，位置存 localStorage（仅移动端生效，桌面端为常规流） */
function enableTopDrag(){
  if(!window.matchMedia('(max-width:820px)').matches) return;
  const topbar=document.querySelector('.topbar');
  const clockEl=document.querySelector('.clock-box');
  const wxEl=document.querySelector('#weatherChip');
  if(!topbar||!clockEl||!wxEl) return;
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem('topLayout')||'{}'); }catch(e){}
  function applyPos(el,key){
    if(saved[key]){ const p=saved[key]; el.style.left=p.left+'px'; el.style.top=p.top+'px'; el.style.right='auto'; }
  }
  function centerPair(){
    const tb=topbar.getBoundingClientRect();
    const cw=clockEl.offsetWidth, ww=wxEl.offsetWidth, gap=26;
    let startX=(tb.width-cw-gap-ww)/2; if(startX<4) startX=4;
    const top=14;
    clockEl.style.left=startX+'px'; clockEl.style.top=top+'px'; clockEl.style.right='auto';
    wxEl.style.left=(startX+cw+gap)+'px'; wxEl.style.top=top+'px'; wxEl.style.right='auto';
  }
  if(saved.clock&&saved.weather){ applyPos(clockEl,'clock'); applyPos(wxEl,'weather'); }
  else centerPair();
  function makeDraggable(el,key){
    el.style.cursor='grab'; el._dragged=false;
    let dragging=false,sx=0,sy=0,ox=0,oy=0;
    const down=(e)=>{
      dragging=true; el._dragged=false;
      const r=el.getBoundingClientRect(), tb=topbar.getBoundingClientRect();
      ox=r.left-tb.left; oy=r.top-tb.top; sx=e.clientX; sy=e.clientY;
      el.style.zIndex=20; el.style.cursor='grabbing';
    };
    const move=(e)=>{
      if(!dragging) return;
      const dx=e.clientX-sx, dy=e.clientY-sy;
      if(Math.abs(dx)>5||Math.abs(dy)>5) el._dragged=true;
      const tb=topbar.getBoundingClientRect();
      let nl=ox+dx, nt=oy+dy;
      nl=Math.max(2,Math.min(nl,tb.width-el.offsetWidth-2));
      nt=Math.max(2,Math.min(nt,tb.height-el.offsetHeight-2));
      el.style.left=nl+'px'; el.style.top=nt+'px'; el.style.right='auto';
      if(el._dragged) e.preventDefault();
    };
    const up=()=>{
      if(!dragging) return;
      dragging=false; el.style.cursor='grab'; el.style.zIndex=5;
      if(el._dragged){
        const tb=topbar.getBoundingClientRect(), r=el.getBoundingClientRect();
        saved[key]={left:Math.round(r.left-tb.left), top:Math.round(r.top-tb.top)};
        localStorage.setItem('topLayout',JSON.stringify(saved));
      }
    };
    el.addEventListener('pointerdown',down);
    window.addEventListener('pointermove',move);
    window.addEventListener('pointerup',up);
  }
  makeDraggable(clockEl,'clock');
  makeDraggable(wxEl,'weather');
  // 拖动结束后抑制天气卡片的 click，避免误触发定位
  wxEl.addEventListener('click',(e)=>{
    if(wxEl._dragged){ e.stopImmediatePropagation(); e.preventDefault(); wxEl._dragged=false; }
  }, true);
  // 首次进入给个一次性小提示
  if(!localStorage.getItem('topDragTip')){
    localStorage.setItem('topDragTip','1');
    setTimeout(()=>toast('小提示：顶栏的时间 ⏰ 和天气 ☁️ 可以长按拖动摆放~'), 1200);
  }
  let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{
    if(!window.matchMedia('(max-width:820px)').matches) return;
    const s2={}; try{ s2=JSON.parse(localStorage.getItem('topLayout')||'{}'); }catch(e){}
    if(!(s2.clock&&s2.weather)) centerPair();
  },250); });
}

/* 通用指针拖拽排序：鼠标 + 触屏通用，自动区分 点击 / 拖拽 / 滚动 */
function makeSortable(container, itemSel, opts){
  const TH=7;
  let startX=0,startY=0,item=null,pending=false,dragging=false,moved=false,clone=null,pid=null,horiz=false;
  container.addEventListener('pointerdown',e=>{
    const it=e.target.closest(itemSel); if(!it) return;
    item=it; startX=e.clientX; startY=e.clientY;
    pending=true; dragging=false; moved=false; pid=e.pointerId;
    horiz=getComputedStyle(container).flexDirection.indexOf('row')>=0;
    try{ container.setPointerCapture(pid); }catch(_){}
  });
  container.addEventListener('pointermove',e=>{
    if(!pending) return;
    const dx=e.clientX-startX, dy=e.clientY-startY;
    if(!moved && Math.hypot(dx,dy)>8) moved=true;
    if(!dragging){
      const over=horiz ? (Math.abs(dx)>TH && Math.abs(dx)>Math.abs(dy)) : (Math.abs(dy)>TH && Math.abs(dy)>Math.abs(dx));
      if(!over) return;
      dragging=true;
      const r=item.getBoundingClientRect();
      const offX=startX-r.left, offY=startY-r.top;
      clone=item.cloneNode(true);
      clone.classList.add('sort-ghost'); clone.classList.remove('active');
      clone.style.width=r.width+'px'; clone.style.height=r.height+'px';
      clone.style.left=r.left+'px'; clone.style.top=r.top+'px';
      document.body.appendChild(clone);
      item.classList.add('sort-hidden');
      item._off=[offX,offY];
    }
    const off=item._off;
    clone.style.left=(e.clientX-off[0])+'px';
    clone.style.top=(e.clientY-off[1])+'px';
    const siblings=[...container.children].filter(el=>el!==item && el.matches(itemSel));
    let ref=null;
    for(const s of siblings){
      const r=s.getBoundingClientRect();
      const mid=horiz?r.left+r.width/2:r.top+r.height/2;
      if((horiz?e.clientX:e.clientY)<mid){ ref=s; break; }
    }
    if(ref) container.insertBefore(item,ref); else container.appendChild(item);
  });
  function end(){
    if(!pending) return;
    if(dragging){
      if(clone) clone.remove();
      item.classList.remove('sort-hidden');
      const keys=[...container.querySelectorAll(itemSel)].map(el=>opts.getKey(el));
      opts.onReorder && opts.onReorder(keys);
    }else if(!moved){
      opts.onTap && opts.onTap(item);
    }
    pending=false; dragging=false; moved=false; item=null; clone=null;
  }
  container.addEventListener('pointerup',end);
  container.addEventListener('pointercancel',end);
}

/* 每天 4 个六级核心词：用与词库长度互质的步进，保证相邻天互不重叠 → 每天都是新词 */
function todayEnglishWords(){
  const n=CET6.length, base=dayOfYear()%n, step=17;
  const arr=[];
  for(let k=0;k<4;k++) arr.push(CET6[(base+k*step)%n]);
  return arr;
}
const ENG_STAGES=[
  {name:'第一关 · 小测', short:'小测', desc:'看词选义 / 看义选词'},
  {name:'第二关 · 听音', short:'听音', desc:'听发音，选出单词'},
  {name:'第三关 · 拼词', short:'拼词', desc:'把字母拼回原词'},
];
function engPool(words){ return CET6.filter(x=>!words.includes(x)); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildSpellTiles(w){
  let t=shuffle(w.split(''));
  if(t.join('')===w && t.length>1) t=shuffle(t);
  return t;
}
function buildChoice(words){
  const pool=engPool(words); const qs=[];
  words.forEach(w=>{
    const mode=Math.random()<0.5?'w2cn':'cn2w';
    const correct= mode==='w2cn'? w.cn : w.w;
    const distract=pool.slice(); let opts=[];
    for(let d=0;d<3 && distract.length;d++){ const r=Math.floor(Math.random()*distract.length); const dw=distract.splice(r,1)[0]; opts.push(mode==='w2cn'?dw.cn:dw.w); }
    opts.push(correct); opts=shuffle(opts);
    const prompt= mode==='w2cn'
      ? `<span class="eng-q-w">${esc(w.w)}</span> <button class="spk" data-act="speak" data-text="${esc(w.w)}">🔊</button><div class="eng-q-sub">这个词的意思是？</div>`
      : `<div class="eng-q-cn">「${esc(w.cn)}」</div><div class="eng-q-sub">对应哪个单词？</div>`;
    qs.push({type:'choice', prompt, options:opts, answer:correct, picked:null, ok:null});
  });
  return qs;
}
function buildListen(words){
  const pool=engPool(words); const qs=[];
  words.forEach(w=>{
    const distract=pool.slice(); let opts=[w.w];
    for(let d=0;d<3 && distract.length;d++){ const r=Math.floor(Math.random()*distract.length); const dw=distract.splice(r,1)[0]; opts.push(dw.w); }
    opts=shuffle(opts);
    const prompt=`<button class="eng-play" data-act="speak" data-text="${esc(w.w)}">🔊 点击播放发音</button><div class="eng-q-sub">听到的单词是？ （提示：「${esc(w.cn)}」）</div>`;
    qs.push({type:'listen', prompt, options:opts, answer:w.w, picked:null, ok:null});
  });
  return qs;
}
function buildSpell(words){
  return words.map(w=>({type:'spell', word:w.w, cn:w.cn, ph:w.ph, tiles:buildSpellTiles(w.w), filled:[], used:[], answer:w.w, ok:null}));
}
function buildEngStages(words){ return [buildChoice(words), buildListen(words), buildSpell(words)]; }
function engStageScore(g,s){ return g.stages[s].filter(q=>q.ok).length; }

  }

    return `<div class="eng-game">

      <button class="b-pink eng-start" data-act="engReplay">🔁 再闯一次</button>

  }

    return `<div class="eng-game">
      <div class="eng-game-head">${ENG_STAGES[s].name} 完成 🎊</div>
      <div class="eng-result">本关 <b>${got}</b> / ${tot} 正确</div>
      <div class="eng-emoji">${got===tot?'✨ 完美通关！':got>=Math.ceil(tot*0.6)?'👍 不错，下一关继续':'💡 这一关的错题记得回头看哦'}</div>
      <button class="b-pink eng-start" data-act="${last?'engFinish':'engNextStage'}">${last?'查看总成绩 🏆':'进入下一关 ▶'}</button>
    </div>`;
  }

  const qs=g.stages[g.stage], q=qs[g.i], meta=ENG_STAGES[g.stage];
  const head=`<div class="eng-game-head">${meta.name} <span class="mute" style="font-size:12px">第 ${g.i+1}/${qs.length} 题</span></div>`;
  if(q.type==='spell'){
    const slots=[]; for(let k=0;k<q.word.length;k++){ slots.push(`<span class="eng-slot ${q.filled[k]!==undefined?'filled':''}">${esc(q.filled[k]||'')}</span>`); }
    const tiles=q.tiles.map((t,ti)=>`<button class="eng-tile ${q.used.includes(ti)?'used':''}" data-act="engSpell" data-i="${ti}" ${q.used.includes(ti)?'disabled':''}>${esc(t)}</button>`).join('');
    let inner;
    if(q.ok===null){
      inner=`<div class="eng-slots">${slots.join('')}</div><div class="eng-tiles">${tiles}</div>
        <div style="margin-top:12px;display:flex;gap:8px"><button class="b-soft" data-act="engSpellClear">⌫ 清空重拼</button></div>`;
    } else {
      const fb=`<div class="eng-fb ${q.ok?'ok':'no'}">${q.ok?'✅ 拼对啦！':'❌ 正确拼写：'+esc(q.answer)}</div>`;
      const nb=`<button class="b-soft eng-next" data-act="engNext">${g.i+1>=qs.length?'本关完成 🎊':'下一题 →'}</button>`;
      inner=`${fb}<div class="eng-slots">${slots.join('')}</div><div style="margin-top:12px">${nb}</div>`;
    }
    return `<div class="eng-game">${head}<div class="eng-q-cn">「${esc(q.cn)}」 <span class="eng-q-sub">${esc(q.ph)}</span></div>${inner}</div>`;
  }
  // choice / listen
  let optsTxt='';
  q.options.forEach((o,oi)=>{
    let cls='eng-opt';
    if(q.picked!==null){ if(o===q.answer) cls+=' correct'; else if(oi===q.picked) cls+=' wrong'; }
    optsTxt+=`<button class="${cls}" data-act="engAnswer" data-i="${oi}" ${q.picked!==null?'disabled':''}>${esc(o)}</button>`;
  });
  const fb=q.picked!==null?`<div class="eng-fb ${q.ok?'ok':'no'}">${q.ok?'✅ 答对了！':'❌ 正确答案：'+esc(q.answer)}</div>`:'';
  const nb=q.picked!==null?`<button class="b-soft eng-next" data-act="engNext">${g.i+1>=qs.length?'本关完成 🎊':'下一题 →'}</button>`:'';
  return `<div class="eng-game">${head}<div class="eng-q">${q.prompt}</div><div class="eng-opts">${optsTxt}</div>${fb}${nb?('<div style="margin-top:12px">'+nb+'</div>'):''}</div>`;
}

function rotateReading(dir){
  ui.readOnline=false;
  const pool=readingIndices();
  let pos=pool.indexOf(readIdx);
  if(pos<0) pos=0;
  pos=(pos+(dir||1)+pool.length)%pool.length;
  readIdx=pool[pos];
  renderView();
}
function normalizeOnlineReading(item){
  // 把后端现抓的文章规范化成本地卡片/测验需要的形状
  const r = {
    src: item.src||'在线', lang: item.lang||'zh',
    title: item.title||'无题', author: item.author||'',
    en: item.en||'', zh: item.zh||'', link: item.link||'',
    note: '', words: [], id: item.id||''
  };
  if(r.en){
    // 用 CET6 词典挑正文里出现过的难词，自动出"看词选义/看义选词"
    const seen=new Set(), toks=(r.en.toLowerCase().match(/[a-z]{4,}/g)||[]);
    for(const t of toks){
      const cn=CET6_MAP[t];
      if(cn && !seen.has(t)){ seen.add(t); r.words.push({word:t, cn:cn}); if(r.words.length>=4) break; }
    }
  }
  return r;
}
async function fetchReading(manual){
  const statusEl=document.getElementById('readStatus');
  const kind = ui.readFilter==='TED' ? 'ted' : (ui.readFilter==='essay' ? 'essay' : 'all');
  const url = BACKEND + '/api/reading?type=' + encodeURIComponent(kind) + '&t=' + Date.now();
  if(statusEl) statusEl.textContent='获取中…';
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),9000);
  try{
    // 从后端实时抓取真实网站的文章（每日一文 / 古诗文 / TED / 一言），每次不同、互不重复
    const res=await fetch(url,{cache:'no-store',signal:controller.signal});
    clearTimeout(timer);
    if(!res.ok) throw new Error('bad');
    const data=await res.json();
    if(!data || !data.ok) throw new Error('empty');
    const r=normalizeOnlineReading(data);
    ui.curRead=r; ui.lastOnlineTitle=r.title; ui.readOnline=true;
    renderView();
    toast('已获取在线新文 ✨');
  }catch(e){
    clearTimeout(timer);
    // 离线兜底：后端不可达时回退到内置离线长文库
    ui.readOnline=false;
    if(readIdx<0) readIdx=dayOfYear()%READINGS.length;
    const pool=readingIndices();
    if(!pool.includes(readIdx)) readIdx=pool[0];
    ui.curRead=READINGS[readIdx];
    if(statusEl) statusEl.textContent='离线精选';
    renderView();
    toast('在线源暂时连不上～已显示离线长文 📖');
  }
}

function urlBase64ToUint8Array(b64){
  const p='='.repeat((4-(b64.length%4))%4);
  const raw=atob(b64.replace(/-/g,'+').replace(/_/g,'/'));
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i);
  return out;
}
function pushDeviceId(){

  if(!id){ id='dev-'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('pushDevice',id); }
  return id;
}
function isPushSubscribed(){ return localStorage.getItem('pushSubscribed')==='1'; }
function pushSupported(){ return ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window); }
function renderReminder(){

  }

async function subscribePush(){
  if(!pushSupported()){ toast('当前浏览器不支持推送'); return; }
  let perm='granted';
  try{ perm=await Notification.requestPermission(); }catch(e){}
  if(perm!=='granted'){ toast('需要允许通知才能提醒你哦 🔔'); return; }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC)});
    }
    const dev=pushDeviceId();
    const sched=(DB.todo.fixed||[]).filter(x=>x.time).map(x=>({id:x.id,text:x.text,time:x.time,important:!!x.important}));
    await fetch(BACKEND+'/api/push/subscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:dev, subscription:sub.toJSON(), schedule:sched})});
    localStorage.setItem('pushSubscribed','1');
    toast('已开启每日提醒 🔔 到时间会弹通知');
  }catch(e){ toast('订阅失败：'+(e&&e.message?e.message:'请检查网络')); }
  renderView();
}
async function unsubscribePush(){
  try{ const reg=await navigator.serviceWorker.ready; const sub=await reg.pushManager.getSubscription(); if(sub) await sub.unsubscribe(); }catch(e){}
  const dev=pushDeviceId();
  try{ await fetch(BACKEND+'/api/push/unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:dev})}); }catch(e){}

async function fetchNews(manual){
  const statusEl=document.getElementById('newsStatus');
  const listEl=document.getElementById('newsList');
  if(statusEl) statusEl.textContent='更新中…';
  if(listEl) listEl.innerHTML='<p class="news-loading">正在拉取最新新闻…</p>';
  const now=new Date();
  const hh=String(now.getHours()).padStart(2,'0'), mm=String(now.getMinutes()).padStart(2,'0'), ss=String(now.getSeconds()).padStart(2,'0');
  // 依次尝试：常驻后端（每60秒服务端重抓，真正实时） -> 同源 news.json（每小时自动重爬兜底）
  const sources=[BACKEND+'/api/news','news.json?t='+Date.now()];
  let data=null, usedBackend=false;
  for(const url of sources){
    try{
      const ctrl=new AbortController();
      const t=setTimeout(()=>ctrl.abort(),(url===sources[0]?15000:9000));
      const res=await fetch(url,{cache:'no-store',signal:ctrl.signal});
      clearTimeout(t);
      if(!res.ok) throw new Error('http '+res.status);
      const d=await res.json();
      if(d && d.items && d.items.length){ data=d; usedBackend=(url===sources[0]); break; }
    }catch(e){ /* 尝试下一个源 */ }
  }
  if(data){
    LIVE_NEWS=(data.items||[]).filter(x=>x && x.title);
    if(listEl) listEl.innerHTML=renderNewsList();
    if(statusEl){
      if(usedBackend){
        statusEl.textContent='⚡实时后端 · 本地 '+hh+':'+mm+':'+ss;
        statusEl.title='常驻后端实时数据：服务端每60秒自动重抓央视/人民网/新华网/微博热搜/百度热点 · 服务端数据时间：'+(data.updated||'未知');
      }else{
        statusEl.textContent='🕒每小时快照 · 本地 '+hh+':'+mm+':'+ss;
        statusEl.title='后端休眠/暂时连不上，已回退到同源每小时快照 · 服务端数据时间：'+(data.updated||'未知');
      }
    }
    if(manual) toast('已更新最新新闻 🌐 本地 '+hh+':'+mm+':'+ss);
  }else{
    LIVE_NEWS=null;
    if(listEl) listEl.innerHTML=renderNewsList();
    if(statusEl) statusEl.textContent='离线精选';
    if(manual) toast('暂时连不上服务器～已显示离线新闻 📡');
  }
}

function plogHashStyle(id){
  let h=0; for(let i=0;i<id.length;i++) h=(h*31+id.charCodeAt(i))>>>0;
  const rot=((h%13)-6);                              // -6 ~ 6 度 随机歪
  const dx=((h>>>3)%17)-8;                          // -8 ~ 8 px 水平错位
  const mt=((h>>>5)%22)-9;                          // -9 ~ 12 px 垂直错落
  const brSet=['18px','16px 40px 16px 40px','30px 14px 30px 14px','12px 32px 12px 32px','28px 14px 28px 14px','16px 16px 46px 46px','34px'];
  const br=brSet[(h>>>2)%brSet.length];             // 随机形状，打破方正
  const tint=['#fff5f8','#fef6ff','#f4fbff','#fffaf0','#f4fff7','#fdefff','#fff0f4'];
  const bg=tint[h%tint.length];
  const deco=['🎀','⭐','🌿','💗','🌸','✨','🍓','🌟','🪴','💫','🐰','🌈'];
  const d=deco[(h>>>4)%deco.length];
  return {rot,dx,mt,br,bg,d};
}
function fmtDateCn(s){
  const [Y,M,D]=s.split('-').map(Number);
  const d=new Date(Y,M-1,D);
  const wd=['日','一','二','三','四','五','六'][d.getDay()];
  return `${M}月${D}日 周${wd}`;
}
function shiftDate(s,delta){
  const [Y,M,D]=s.split('-').map(Number);
  const d=new Date(Y,M-1,D); d.setDate(d.getDate()+delta);
  return todayStr(d);
}

function handleAct(act,el){

  switch(act){
    case 'speak': speak(el.dataset.text, el.dataset.lang||'en-US'); break;

    case 'clearToday': clearToday(id); break;

    case 'delFixed': { DB.todo.fixed=(DB.todo.fixed||[]).filter(p=>p.id!==i); save(); pushScheduleSync(); renderView(); break; }
    case 'delRandomToday': { DB.todo.randomToday.ids=(DB.todo.randomToday.ids||[]).filter(id=>id!==i); save(); renderView(); break; }
    case 'delRandomPool': { DB.todo.randomPool=(DB.todo.randomPool||[]).filter(p=>p.id!==i); save(); renderView(); break; }
    case 'rerollRandom': { DB.todo.randomToday={date:'',ids:[]}; ensureRandomToday(); save(); renderView(); toast('已换一批随机待办 🎲'); break; }
    case 'testPush': testPush(); break;
    case 'readPrev': rotateReading(-1); break;
    case 'readNext': rotateReading(1); break;
    case 'refreshRead': fetchReading(true); break;
    case 'readFilter': {
      ui.readFilter=el.dataset.f;
      ui.readOnline=false;
      const pool=readingIndices();
      if(!pool.includes(readIdx)) readIdx=pool[0];
      renderView(); break;
    }
    case 'readQuizStart': case 'readQuizReplay': {
      const key=el.dataset.key;
      const stages=buildReadStages(ui.curRead);
      if(!stages){ toast('这篇生词太少啦～'); break; }
      ui.readQuiz[key]={phase:'playing',stage:0,i:0,score:0,total:stages.reduce((a,s)=>a+s.length,0),stages};
      refreshReadQuiz(); break;
    }
    case 'readQuizAnswer': {
      const key=el.dataset.key, q=+el.dataset.q, opt=+el.dataset.opt;
      const g=ui.readQuiz[key]; if(!g||g.phase!=='playing') break;
      const qq=g.stages[g.stage][q]; if(qq.picked!==null) break;
      qq.picked=opt; if(qq.options[opt]===qq.answer){ qq.ok=true; g.score++; } else qq.ok=false;
      refreshReadQuiz(); break;
    }
    case 'readQuizNext': {
      const key=el.dataset.key; const g=ui.readQuiz[key]; if(!g) break;
      g.i++; if(g.i>=g.stages[g.stage].length) g.phase='stageDone';
      refreshReadQuiz(); break;
    }
    case 'readQuizNextStage': {
      const key=el.dataset.key; const g=ui.readQuiz[key]; if(!g) break;
      g.stage++; g.i=0; g.phase='playing'; refreshReadQuiz(); break;
    }
    case 'readQuizFinish': {
      const key=el.dataset.key; const g=ui.readQuiz[key]; if(!g) break;
      g.phase='done'; refreshReadQuiz(); break;
    }
    case 'refreshNews': fetchNews(true); break;
    case 'newsFilter': selectNewsFilter(el.dataset.src); break;
    case 'playSong': loadSong(+i,true); break;
    case 'togglePlay': togglePlay(); break;
    case 'nextSong': playStep(1); break;
    case 'prevSong': playStep(-1); break;
    case 'plogAddFrame': { ui.plogTargetId=null; const fi=$('#plogFile'); if(fi) fi.click(); break; }

      const oi=+el.dataset.i; q.picked=oi;
      if(q.options[oi]===q.answer){ q.ok=true; g.score++; } else q.ok=false;
      renderView(); break;
    }
    case 'engSpell': {
      const g=ui.eng; if(!g||g.phase!=='playing') break;
      const q=g.stages[g.stage][g.i]; if(!q||q.type!=='spell'||q.ok!==null) break;
      const ti=+el.dataset.i; if(q.used.includes(ti)) break;
      q.filled.push(q.tiles[ti]); q.used.push(ti);
      if(q.filled.length===q.word.length){
        if(q.filled.join('')===q.answer){ q.ok=true; g.score++; } else q.ok=false;
      }
      renderView(); break;

    case 'engSpellClear': {
      const g=ui.eng; if(!g) break;

      break;
    }
  }

  switch(act){
    case 'doneFixed': { setTodoDone('f:'+i, el.checked); renderView(); break; }
    case 'doneRandom': { setTodoDone('r:'+i, el.checked); renderView(); break; }
    case 'setFixedTime': { const x=(DB.todo.fixed||[]).find(p=>p.id===i); if(x){ x.time=el.value||''; save(); pushScheduleSync(); renderView(); } break; }
    case 'setRandomCount': { let n=parseInt(el.value,10)||3; n=Math.max(1,Math.min(10,n)); DB.todo.randomCount=n; DB.todo.randomToday={date:'',ids:[]}; ensureRandomToday(); save(); renderView(); break; }
    case 'togglePush': { if(el.checked) subscribePush(); else unsubscribePush(); break; }
    case 'toggleDaily': { const id=el.dataset.id; DB.settings.daily[id]=el.checked; ui.showAll[id]=!el.checked; save(); break; }
    case 'plogFile': {
      const f=el.files && el.files[0]; if(!f) return;
      toast('图片处理中…');
      compressImage(f).then(dataUrl=>{
        DB.mood.plogs = DB.mood.plogs || [];
        if(ui.plogTargetId){ const x=DB.mood.plogs.find(p=>p.id===ui.plogTargetId); if(x) x.img=dataUrl; }
        else { DB.mood.plogs.push({id:uid(),date:ui.viewDate||todayStr(),time:nowTime(),text:'',mood:'',img:dataUrl}); }
        save(); ui.plogTargetId=null; renderView();
      }).catch(()=>toast('图片读取失败，换一张试试～'));
      el.value='';
      break;
    }
    case 'plogCap': {
      const x=DB.mood.plogs.find(p=>p.id===el.dataset.id);
      if(x){ x.text=el.value; save(); }
      break;
    }
    case 'plogDayNote': {
      DB.mood.dailyNotes = DB.mood.dailyNotes || {};
      DB.mood.dailyNotes[ui.viewDate||todayStr()] = el.value;
      save();
      break;
    }
  }
}
function handleForm(act,form){
  const f=form;
  switch(act){
    case 'addTxn': {
      DB.finance.txns.push({id:uid(),type:f.type.value,amount:+f.amount.value,category:f.category.value.trim(),note:f.note.value.trim(),date:todayStr()});
      break; }
    case 'addFixed': {
      DB.todo.fixed.push({id:uid(),text:f.text.value.trim(),important:f.important.checked,time:f.time.value||''});
      break; }
    case 'addRandomPool': {
      DB.todo.randomPool.push({id:uid(),text:f.text.value.trim()});
      break; }
    case 'doSetSyncPass': {
      const pw=f.pw.value, pw2=f.pw2.value;
      if(pw.length<4){ toast('密码至少4位'); break; }
      if(pw!==pw2){ toast('两次输入不一致'); break; }
      deriveKey(pw).then(async key=>{
        _cryptoKey=key;
        localStorage.setItem('syncLockOn','1');
        sessionStorage.setItem('syncPass',pw);
        $('#modalMask').classList.remove('show');
        await pushSync();   // 立即以密文重新上传
        toast('🔒 已开启加密，云端只存密文');
      }).catch(()=>toast('设置失败，重试'));
      break;
    }
    case 'doUnlock': {
      const pw=f.pw.value;
      deriveKey(pw).then(async key=>{
        _cryptoKey=key; sessionStorage.setItem('syncPass',pw);
        $('#modalMask').classList.remove('show');
        if(_keyResolve){ _keyResolve(true); _keyResolve=null; _keyPromise=null; }
        pullSync(true).then(()=>pushSync());
      }).catch(()=>toast('密码错误'));
      break;
    }
  }
  save(); form.reset(); renderView();
}

function clearToday(id){
  if(!confirm('确定清空「'+MODULES[id].name+'」今日（'+todayStr()+'）的记录吗？\n历史数据不会受影响。')) return;
  const t=todayStr();
  switch(id){
    case 'finance': DB.finance.txns=DB.finance.txns.filter(x=>x.date!==t); break;
    case 'todo': { if(DB.todo.done[t]) delete DB.todo.done[t]; break; }
    case 'mood': DB.mood.plogs=DB.mood.plogs.filter(x=>x.date!==t); break;
  }
  save(); renderView(); toast('今日记录已清空');
}

/* ===================== 设置 / 数据 ===================== */
function openSettings(){
  let h=`<button class="close" data-act="closeSettings">×</button>
    <h3>⚙️ 设置 / 数据</h3>
    <h4>每日重置设置</h4>
    <p style="font-size:12px;color:var(--text-soft);margin-bottom:6px">开启后，该模块默认「只看今日」，并可一键清空今日；关闭则一直累积。</p>`;
  const DATA_MODS=['finance','todo','mood'];
  for(const id of DATA_MODS){
    h+=`<label class="opt">${MODULES[id].icon} ${MODULES[id].name}
      <input type="checkbox" data-act="toggleDaily" data-id="${id}" ${DB.settings.daily[id]?'checked':''}></label>`;
  }
  h+=`<h4>数据管理（全部保存在本机浏览器）</h4>
    <div class="btn-row">
      <button class="b-soft" data-act="exportData">⬇️ 导出备份</button>
      <button class="b-soft" id="importBtn">⬆️ 导入恢复</button>
    </div>
    <div class="btn-row">
      <button class="b-red" data-act="clearAll">🗑 清空全部数据</button>
      <button class="b-pink" data-act="closeSettings">完成</button>
    </div>
    <input type="file" id="importFile" accept="application/json" style="display:none">
    <h4>🔒 云端加密同步（密码锁）</h4>
    <p style="font-size:12px;color:var(--text-soft);margin-bottom:6px">开启后，上传到云端的数据会用你的密码加密，服务器只存密文、打不开。忘记密码将无法恢复，请牢记。</p>
    <div class="btn-row">
      <button class="b-pink" data-act="setSyncPass">🔑 设置同步密码</button>
      <button class="b-soft" data-act="disableSyncLock" ${localStorage.getItem('syncLockOn')==='1'?'':'style="display:none"'}>🔓 关闭加密</button>
    </div>`;
  $('#modal').innerHTML=h;
  $('#modalMask').classList.add('show');
  $('#importBtn').addEventListener('click',()=>$('#importFile').click());
  $('#importFile').addEventListener('change',importData);
}
function exportData(){
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='我的小天地-备份-'+todayStr()+'.json';
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出备份文件');
}
function importData(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{ const d=JSON.parse(reader.result); DB=Object.assign(defaults(),d); save(); initShowAll(); renderSidebar(); renderView(); $('#modalMask').classList.remove('show'); toast('数据已恢复 ✅'); }
    catch(err){ toast('文件格式不正确'); }
  };
  reader.readAsText(file);
}
function clearAll(){
  if(!confirm('⚠️ 确定清空全部数据吗？此操作不可恢复（建议先导出备份）。')) return;
  DB=defaults(); save(); initShowAll(); ui.plogTargetId=null; ui.frameSlots=6; ui.viewDate=todayStr(); ui.selMode=false; ui.selIds=[]; ui.calY=null; ui.calM=null; renderSidebar(); renderView(); $('#modalMask').classList.remove('show'); toast('已全部清空');
}

/* ===================== 事件绑定 ===================== */
function bindView(){
  const view=$('#view');
  view.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; handleAct(el.dataset.act,el); });
  view.addEventListener('change',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; handleChange(el.dataset.act,el); });
  view.addEventListener('submit',e=>{ const f=e.target.closest('form[data-act]'); if(!f) return; e.preventDefault(); handleForm(f.dataset.act,f); });
  // 长按相框 → 进入多选删除模式
  let _lpTimer=null;
  view.addEventListener('pointerdown',e=>{
    if(ui.selMode) return;
    const f=e.target.closest('.frame'); if(!f) return;
    if(e.target.closest('.frame-cap')) return;     // 输入框里不触发
    const id=f.dataset.id; if(!id) return;
    _lpTimer=setTimeout(()=>{
      ui._lp=true; setTimeout(()=>{ui._lp=false;},600);
      ui.selMode=true; ui.selIds=[id]; renderView();
      if(navigator.vibrate){ try{navigator.vibrate(30);}catch(_){} }
    },500);
  });
  const _lpClear=()=>{ if(_lpTimer){clearTimeout(_lpTimer);_lpTimer=null;} };
  view.addEventListener('pointermove',_lpClear);
  view.addEventListener('pointerup',_lpClear);
  view.addEventListener('pointercancel',_lpClear);
  view.addEventListener('click',e=>{ if(ui._lp){ e.stopPropagation(); e.preventDefault(); ui._lp=false; } }, true);
  view.addEventListener('contextmenu',e=>{ if(e.target.closest('.frame')) e.preventDefault(); });
}
function bindGlobal(){
  $('#gearBtn').addEventListener('click',openSettings);
  const gt=$('#gearTop'); if(gt) gt.addEventListener('click',openSettings);
  const wx=$('#weatherChip'); if(wx) wx.addEventListener('click',initWeather); // 点一下重新请求定位/刷新天气
  // 设置弹窗内的按钮也在 #view 之外，需单独委托
  const mask=$('#modalMask');
  mask.addEventListener('click',e=>{
    if(e.target===$('#modalMask')){ mask.classList.remove('show'); return; }
    const el=e.target.closest('[data-act]'); if(!el) return; handleAct(el.dataset.act,el);
  });
  mask.addEventListener('change',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; handleChange(el.dataset.act,el); });
  const cal=$('#calMask');
  cal.addEventListener('click',e=>{
    if(e.target===$('#calMask')){ cal.classList.remove('show'); return; }
    const el=e.target.closest('[data-act]'); if(!el) return; handleAct(el.dataset.act,el);
  });
  // 心情相框 · 查看大图弹层：点空白处关闭
  const pv=$('#photoViewer');
  if(pv){
    pv.addEventListener('click',e=>{
      if(e.target===$('#photoViewer')){ $('#photoViewer').classList.remove('show'); return; }
      const el=e.target.closest('[data-act]'); if(!el) return; handleAct(el.dataset.act,el);
    });
  }
}

/* ===================== 启动 ===================== */
async function init(){
  initShowAll();
  renderSidebar(); bindSidebar();
  bindView(); bindGlobal();
  setupAudio();
  renderClock(); renderQuote();
  initWeather();
  enableTopDrag();
  try{ await loadIdb(); }catch(e){}
  renderView();
  setInterval(renderClock,1000);
  // 云端同步：启动即拉取最新，之后每 45 秒自动双向同步
  injectSyncBadge();
  if(localStorage.getItem('syncLockOn')==='1'){ try{ await ensureKey(); }catch(e){} }
  pullSync(true).then(()=>recoverSeed()).then(()=>pushSync());
  setInterval(()=>{ pullSync(true).then(()=>recoverSeed()).then(()=>pushSync()); }, 45000);
  // 启动即尝试恢复历史相框（用内联种子，不依赖网络/缓存，加载就有）
  recoverSeed();
}
function setupAudio(){
  const a=document.getElementById('player');
  player.audio=a;
  a.addEventListener('timeupdate',()=>{
    const r=$('#npRange'); if(r&&a.duration) r.value=Math.floor(a.currentTime/a.duration*100);
    const c=$('#npCur'); if(c) c.textContent=fmtTime(a.currentTime);
    syncLyrics(a.currentTime);
  });
  a.addEventListener('loadedmetadata',()=>{ const d=$('#npDur'); if(d) d.textContent=fmtTime(a.duration); });
  a.addEventListener('play',updateNowPlaying);
  a.addEventListener('pause',updateNowPlaying);
  a.addEventListener('ended',()=>playStep(1));
  a.addEventListener('error',()=>toast('播放失败，换个网络再试～'));
}
init();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
