# Cloudflare Workers + Static Assets 配置
# 本站点是单文件 SPA + /api/* 后端，静态资源与 Worker 一起部署。
name = "cute-workbench"
main = "_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
# 仓库根目录即为静态资源目录（index.html / seed.js / sw.js 等）
directory = "."
binding = "ASSETS"
# SPA 行为：非静态资源路径返回 index.html，让前端路由接管
not_found_handling = "single-page-application"

# 非敏感环境变量（敏感变量请在 Dashboard 或 wrangler secret put 设置）
[vars]
VAPID_PUBLIC = "BGsde9o-MzxqNO0vzu6VPhPq__PNTzqx_GwgNBNvMcTkbQcx3QVtBBIer3qU1tvx3SfwKjZM1rq6YEGpM85wchA"
GH_REPO = "Jamie-666-H/cute-news-backend"
GH_BRANCH = "data"
