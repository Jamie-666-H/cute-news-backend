[build]
  # 站点本身就是单文件前端，无需构建；发布目录即仓库根
  publish = "."
  functions = "netlify/functions"
  command = "echo skip-build"

[build.environment]
  # Web Push 的 VAPID 密钥（与前端 VAPID_PUBLIC 配套）。免费、无需绑卡。
  VAPID_PUBLIC = "BGsde9o-MzxqNO0vzu6VPhPq__PNTzqx_GwgNBNvMcTkbQcx3QVtBBIer3qU1tvx3SfwKjZM1rq6YEGpM85wchA"
  VAPID_PRIVATE = "VxW2gdyFJF3bQ78B7PgVLSoSdriLRiI5wiDyEcYB-7Q"
  # 云端同步/推送订阅持久化到 GitHub 仓库（免费、不占 Netlify 流量）。
  # 在 Netlify 后台 Site settings → Environment variables 添加：
  #   GH_TOKEN = 一个对 Jamie-666-H/cute-news-backend 有 write 权限的 GitHub Personal Access Token
  #   GH_REPO  = Jamie-666-H/cute-news-backend （一般无需改）
  # 不填则同步仅本机生效（数据存在手机本地），换设备/清缓存需重新导入。

# 把 /api/* 路由到同名云函数（保证前端同源调用，无需改代码）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# 禁止 Netlify Edge 长期缓存 index.html 与 sw.js，确保代码更新能及时生效
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate, no-cache"
    Netlify-Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Netlify-Cache-Control = "public, max-age=0, must-revalidate"
