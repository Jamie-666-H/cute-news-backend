[build]
  # 站点本身就是单文件前端，无需构建；发布目录即仓库根
  publish = "."
  functions = "netlify/functions"
  command = "echo skip-build"

[build.environment]
  # Web Push 的 VAPID 密钥（与前端 VAPID_PUBLIC 配套）。免费、无需绑卡。
  VAPID_PUBLIC = "BGsde9o-MzxqNO0vzu6VPhPq__PNTzqx_GwgNBNvMcTkbQcx3QVtBBIer3qU1tvx3SfwKjZM1rq6YEGpM85wchA"
  VAPID_PRIVATE = "VxW2gdyFJF3bQ78B7PgVLSoSdriLRiI5wiDyEcYB-7Q"

# 把 /api/* 路由到同名云函数（保证前端同源调用，无需改代码）
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
